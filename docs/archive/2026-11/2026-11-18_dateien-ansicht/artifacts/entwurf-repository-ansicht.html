<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf: Repository-Ansicht</title>
<style>
:root {
  --bg: #ffffff; --bg-side: #f8f8f8; --bg-surface: #ffffff; --bg-hover: #f0f0f0; --bg-selected: #e4e6f1;
  --border-subtle: #e5e5e5; --border: #cecece;
  --fg: #3c3c3c; --fg-2: #555555; --muted: #6e6e6e;
  --accent: #c4572f; --accent-text: #a8461f; --on-accent: #ffffff;
  --running: #2563eb; --waiting: #8a5700; --error: #c5352e; --done: #16803c; --script: #7c3aed;
  --add: #15773a; --delc: #c5352e; --add-bg: #e8f6ee; --del-bg: #fdeceb; --hunk-bg: #f3f3f6;
  --k: #0000ff; --s: #a31515; --c: #008000; --n: #098658; --f: #795e26; --t: #267f99; --va: #001080;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.14); --scrim: rgb(0 0 0 / 0.28);
  --delc-strong: #a82720; --running-strong: #1b4bc4; --done-strong: #116330; --script-strong: #6d28d9;
  --sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1f1f; --bg-side: #181818; --bg-surface: #252526; --bg-hover: #2e2e30; --bg-selected: #37373d;
  --border-subtle: #2b2b2b; --border: #3c3c3c;
  --fg: #d4d4d4; --fg-2: #b0b0b0; --muted: #8f8f8f;
  --accent: #e0825c; --accent-text: #eea283; --on-accent: #1d130e;
  --running: #5b9dff; --waiting: #f2b33d; --error: #f47067; --done: #4cc38a; --script: #a78bfa;
  --add: #4cc38a; --delc: #f47067; --add-bg: #243129; --del-bg: #362827; --hunk-bg: #242428;
  --k: #569cd6; --s: #ce9178; --c: #6a9955; --n: #b5cea8; --f: #dcdcaa; --t: #4ec9b0; --va: #9cdcfe;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.45); --scrim: rgb(0 0 0 / 0.55);
  --delc-strong: #ff9088; --running-strong: #82b4ff; --done-strong: #4cc38a; --script-strong: #bcaaff;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1f1f1f; --bg-side: #181818; --bg-surface: #252526; --bg-hover: #2e2e30; --bg-selected: #37373d;
  --border-subtle: #2b2b2b; --border: #3c3c3c;
  --fg: #d4d4d4; --fg-2: #b0b0b0; --muted: #8f8f8f;
  --accent: #e0825c; --accent-text: #eea283; --on-accent: #1d130e;
  --running: #5b9dff; --waiting: #f2b33d; --error: #f47067; --done: #4cc38a; --script: #a78bfa;
  --add: #4cc38a; --delc: #f47067; --add-bg: #243129; --del-bg: #362827; --hunk-bg: #242428;
  --k: #569cd6; --s: #ce9178; --c: #6a9955; --n: #b5cea8; --f: #dcdcaa; --t: #4ec9b0; --va: #9cdcfe;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.45); --scrim: rgb(0 0 0 / 0.55);
  --delc-strong: #ff9088; --running-strong: #82b4ff; --done-strong: #4cc38a; --script-strong: #bcaaff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--running); outline-offset: 1px; }
.row:hover, .row.is-sel, .repo:hover, .res.is-act, .res:hover, .pop__i:hover, .pop__i[aria-selected="true"], .vl__c:hover, .vl__f:hover, .linkrow:hover, .seg button:hover, .seg button[aria-pressed="true"] { --muted: var(--fg-2); --delc: var(--delc-strong); --error: var(--delc-strong); --running: var(--running-strong); --done: var(--done-strong); --add: var(--done-strong); --script: var(--script-strong); }
.res:hover { background: var(--bg-hover); }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.add { color: var(--add); } .del { color: var(--delc); }
.num { font: 11.5px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Entwurfsleiste */
.ebar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 12px; background: var(--bg-side); border-bottom: 1px solid var(--border); font-size: 12px; }
.ebar__t { font-weight: 600; }
.ebar label { color: var(--muted); margin-right: 4px; }
.ebar__g { display: flex; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--bg-surface); border: 0; border-right: 1px solid var(--border); padding: 3px 10px; min-height: 26px; font-size: 12.5px; color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--bg-hover); }
.seg button[aria-pressed="true"] { background: var(--bg-selected); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.seg .n { font: 11px var(--mono); color: var(--muted); font-weight: 400; }
.btn { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; min-height: 28px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { color: var(--muted); cursor: not-allowed; border-style: dashed; }
.btn[disabled]:hover { border-color: var(--border); }
.btn--quiet { border-color: transparent; background: none; color: var(--fg-2); }
.btn--quiet:hover { background: var(--bg-hover); border-color: transparent; }
.btn--sm { min-height: 24px; padding: 1px 7px; font-size: 12px; }
.btn--on { border-color: var(--accent); background: var(--bg-selected); font-weight: 600; }

/* App-Rahmen */
.app { flex: 1; min-height: 0; display: flex; flex-direction: column; container: app / inline-size; position: relative; }
.hdr { display: flex; align-items: center; gap: 6px 14px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.crumbs { color: var(--fg-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
.crumbs b { color: var(--fg); font-weight: 600; }
.tabs button { min-height: 30px; font-size: 13px; padding: 3px 14px; }
.tb { display: flex; align-items: center; gap: 6px 12px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.tb__sum { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; }
.search { margin-left: auto; position: relative; flex: 1 1 240px; max-width: 360px; min-width: 180px; }
.search input { width: 100%; height: 28px; padding: 0 62px 0 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-surface); }
.search input::placeholder { color: var(--muted); }
.search > svg { position: absolute; left: 8px; top: 7px; color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 6px; top: 5px; font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; pointer-events: none; }
.results { position: absolute; right: 12px; top: 0; width: min(580px, calc(100cqw - 24px)); max-height: min(60vh, 460px); overflow: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 30; }
.results__h, .results__f { padding: 5px 10px; font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.results__f { border-top: 1px solid var(--border-subtle); position: sticky; bottom: 0; background: var(--bg-surface); }
.res { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 10px; background: none; border: 0; border-left: 2px solid transparent; text-align: left; min-height: 26px; }
.res.is-act { background: var(--bg-selected); border-left-color: var(--accent); }
.res__n { white-space: nowrap; }
.res__n mark { background: none; color: var(--accent-text); font-weight: 700; text-decoration: underline; }
.res__d { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; direction: rtl; text-align: left; }
.results__empty { padding: 14px 12px; color: var(--fg-2); }

.body { flex: 1; min-height: 0; display: flex; position: relative; }
.left { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); background: var(--bg-side); min-height: 0; }
.home { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-left: 2px solid transparent; border-bottom: 1px solid var(--border-subtle); background: none; text-align: left; font-weight: 600; }
.home span:nth-of-type(1) { flex: 1; }
.home:hover { background: var(--bg-hover); --muted: var(--fg-2); }
.home.is-on { background: var(--bg-selected); border-left-color: var(--accent); --muted: var(--fg-2); }
.left__head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.left__head .sp { flex: 1; }
.left__scroll { flex: 1; overflow: auto; min-height: 0; }
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; container: detail / inline-size; }
.detail__scroll { flex: 1; overflow: auto; min-height: 0; }
.page { padding: 16px 20px 40px; max-width: 980px; }
.page h2 { font-size: 14px; font-weight: 600; margin: 22px 0 8px; }
.page h2:first-child { margin-top: 0; }
.page p { margin: 4px 0; color: var(--fg-2); }
.only-narrow { display: none !important; }

/* Baum */
.repo { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-top: 1px solid var(--border-subtle); position: sticky; top: 0; background: var(--bg-side); z-index: 2; cursor: pointer; }
.repo:first-child { border-top: 0; }
.repo:hover { background: var(--bg-hover); }
.repo__t { flex: 1; min-width: 0; }
.repo__nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo__sub { font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 12px; height: 12px; transition: transform 120ms; color: var(--muted); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.row { position: relative; display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px 0 calc(8px + var(--d, 0) * 14px); cursor: pointer; white-space: nowrap; border-left: 2px solid transparent; font-size: 12.5px; }
.row::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: calc(var(--d, 0) * 14px); background: repeating-linear-gradient(90deg, var(--border) 0 1px, transparent 1px 14px); pointer-events: none; opacity: 0.7; }
.row:hover { background: var(--bg-hover); }
.row.is-sel { background: var(--bg-selected); border-left-color: var(--accent); }
.row:focus-visible { outline-offset: -2px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row--file .chev { visibility: hidden; }
.tree--alle .row--file .nm { color: var(--fg-2); }
.tree--alle .row--file.is-ch .nm, .tree--alle .row--dir.is-ch .nm { color: var(--fg); font-weight: 600; }
.ltr { width: 14px; text-align: center; font: 700 11px var(--mono); }
.ltr--A { color: var(--add); } .ltr--D { color: var(--delc); } .ltr--M { color: var(--fg); }
.cnt { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 5px; line-height: 15px; }
.ico { width: 18px; text-align: center; font: 700 9px var(--mono); letter-spacing: -0.3px; flex-shrink: 0; }
.c-run { color: var(--running); } .c-wait { color: var(--waiting); } .c-acc { color: var(--accent-text); } .c-scr { color: var(--script); }
.c-err { color: var(--error); } .c-done { color: var(--done); } .c-mut { color: var(--muted); }
.fold { color: var(--fg-2); }
.row--ign .nm { color: var(--muted); font-style: italic; font-weight: 400 !important; }
.ign { font-size: 11px; color: var(--muted); }
.code tr.is-line td { background: var(--bg-selected); }
.code tr.is-line .no { color: var(--fg); font-weight: 700; }
.chat { max-width: 780px; padding: 16px 20px 40px; }
.chat__hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.chat__u { background: var(--bg-hover); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px auto; width: fit-content; max-width: 80%; }
.chat__a p { margin: 8px 0; line-height: 1.7; }
.flink { font: 12px var(--mono); background: var(--hunk-bg); border: 0; border-radius: 4px; padding: 1px 5px; color: var(--accent-text); text-decoration: underline; overflow-wrap: anywhere; text-align: left; }
.flink:hover { background: var(--bg-selected); }
.chat__err { border: 1px solid var(--error); border-radius: 6px; padding: 6px 10px; margin-top: 12px; }
.note { padding: 8px 12px 10px 30px; color: var(--muted); font-size: 12px; white-space: normal; }
.empty { padding: 28px 20px; color: var(--fg-2); max-width: 560px; }
.empty b { display: block; color: var(--fg); font-size: 14px; margin-bottom: 4px; }

/* Kennzahlen, Tabellen */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); border: 1px solid var(--border-subtle); border-radius: 8px; overflow: hidden; margin: 0 0 6px; }
.facts div { padding: 7px 14px; box-shadow: 1px 0 0 var(--border-subtle), 0 1px 0 var(--border-subtle); }
.facts b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts div > span { color: var(--muted); font-size: 12px; white-space: nowrap; }
table.grid { border-collapse: collapse; width: 100%; }
table.grid th, table.grid td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
table.grid th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.grid td.mono { overflow-wrap: anywhere; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot--warn { background: var(--waiting); }
.linkrow { cursor: pointer; }
.linkrow:hover td { background: var(--bg-hover); }

/* Verlauf */
.vl__s { border-left: 2px solid var(--border); margin: 0 0 12px 3px; padding: 0 0 0 12px; }
.vl__s.is-on { border-left-color: var(--accent); }
.vl__h { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 2px; }
.vl__nr { font: 700 12px var(--mono); }
.vl__ti { font-weight: 600; }
.vl__c { display: flex; gap: 8px; align-items: center; width: 100%; padding: 3px 6px 3px 2px; border: 0; background: none; text-align: left; border-radius: 4px; min-height: 26px; }
.vl__c:hover { background: var(--bg-hover); }
.vl__c .sub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vl__f { display: flex; gap: 6px; align-items: center; width: 100%; padding: 1px 6px 1px 22px; border: 0; background: none; text-align: left; min-height: 24px; border-radius: 4px; font-size: 12.5px; }
.vl__f:hover { background: var(--bg-hover); }
.vl__f .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.left .vl { padding: 10px 8px 20px; }
.left .vl__f { padding-left: 14px; }
.left .vl__c .pill, .left .vl__c .muted.num { display: none; }

/* Datei */
.fh { display: flex; align-items: center; gap: 6px 10px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.fh__path { flex: 1 1 260px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; font-size: 12.5px; }
.fh__path button { background: none; border: 0; padding: 1px 3px; color: var(--fg-2); border-radius: 4px; }
.fh__path button:hover { background: var(--bg-hover); color: var(--fg); }
.fh__path b { padding: 1px 3px; overflow-wrap: anywhere; }
.fh__path i { color: var(--muted); font-style: normal; }
.fh__act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.steps { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; font-size: 12.5px; }
.steps__l { color: var(--muted); }
.code { font: 12px/1.5 var(--mono); border-collapse: collapse; min-width: 100%; tab-size: 4; }
.code td { padding: 0 10px 0 6px; white-space: pre; vertical-align: top; }
.code .no { position: sticky; left: 0; background: var(--bg); color: var(--muted); text-align: right; user-select: none; width: 46px; min-width: 46px; max-width: 46px; padding: 0 6px; }
.code .no2 { left: 46px; }
.code .sg { width: 14px; min-width: 14px; padding: 0; text-align: center; user-select: none; font-weight: 700; }
.code tr.a td { background: var(--add-bg); } .code tr.d td { background: var(--del-bg); }
.code tr.h td { background: var(--hunk-bg); color: var(--muted); padding-top: 2px; padding-bottom: 2px; }
.code tr.a .sg { color: var(--add); } .code tr.d .sg { color: var(--delc); }
.code .mk { width: 5px; min-width: 5px; padding: 0; }
.code tr.m-add .mk { background: var(--add); }
.code tr.m-del .mk { box-shadow: inset 0 3px 0 var(--delc); }
.hljs-keyword, .hljs-literal, .hljs-built_in, .hljs-tag, .hljs-name, .hljs-selector-tag, .hljs-bullet { color: var(--k); }
.hljs-string, .hljs-regexp, .hljs-link { color: var(--s); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--c); }
.hljs-number { color: var(--n); }
.hljs-title, .hljs-selector-class, .hljs-selector-id, .hljs-section { color: var(--f); }
.hljs-type, .hljs-title.class_ { color: var(--t); }
.hljs-variable, .hljs-attr, .hljs-attribute, .hljs-property, .hljs-params { color: var(--va); }
.imgprev { padding: 24px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.imgprev img { max-width: 100%; border: 1px solid var(--border); background: repeating-conic-gradient(var(--bg-hover) 0% 25%, var(--bg) 0% 50%) 50% / 16px 16px; }
.lock { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--running); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
.lock p { margin: 0; color: var(--fg); flex: 1; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.pill { font: 11.5px var(--mono); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.pill--own { border-color: var(--accent); color: var(--accent-text); }

/* Auswahl mit Suche, Dialog, Toast */
.pop { position: absolute; left: 12px; top: 0; width: min(440px, calc(100cqw - 24px)); max-height: min(60vh, 440px); overflow: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 30; }
.pop input { width: calc(100% - 16px); margin: 8px; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.pop__i { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 5px 10px; border: 0; border-left: 2px solid transparent; background: none; text-align: left; }
.pop__i:hover { background: var(--bg-hover); }
.pop__i[aria-selected="true"] { background: var(--bg-selected); border-left-color: var(--accent); font-weight: 600; }
.pop__i .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.anchor { position: relative; height: 0; }
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-surface); color: var(--fg); padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--scrim); }
.dlg { padding: 16px 20px 18px; }
.dlg h1 { font-size: 16px; margin: 0 0 8px; }
.dlg h2 { font-size: 13px; margin: 14px 0 4px; }
.dlg ul { margin: 2px 0; padding-left: 18px; }
.dlg li { margin: 3px 0; }
.dlg__x { float: right; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; z-index: 60; font-size: 12.5px; max-width: calc(100vw - 24px); }
.toast[hidden] { display: none; }
#err { background: var(--del-bg); color: var(--fg); padding: 4px 12px; font: 12px var(--mono); white-space: pre-wrap; }
#err:empty { display: none; }

/* Schmal: erst Baum, dann Detail */
@container app (max-width: 780px) {
  .left { width: 100%; border-right: 0; }
  .body[data-pane="tree"] .detail { display: none; }
  .body[data-pane="detail"] .left { display: none; }
  .only-narrow { display: inline-flex !important; }
  .search { max-width: none; flex-basis: 100%; }
  .page { padding: 14px 12px 32px; }
}
@container detail (max-width: 640px) {
  table.grid--stack, table.grid--stack tbody, table.grid--stack tr, table.grid--stack td { display: block; }

<script>
'use strict';
const D = window.DATEN;
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (n) => n.toLocaleString('de-DE');
const when = (t) => (t ? new Date(t * 1000).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '');
const stat = (a, d) => `<span class="num"><span class="add">+${nf(a)}</span> <span class="del">−${nf(d)}</span></span>`;

/* ---------- Symbole ---------- */
const I = {
  chev: '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  dir: '<svg class="fold" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.2c0-.7.5-1.2 1.2-1.2h3l1.4 1.5h6.2c.7 0 1.2.5 1.2 1.2v6.1c0 .7-.5 1.2-1.2 1.2H2.7c-.7 0-1.2-.5-1.2-1.2z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>',
  dirOpen: '<svg class="fold" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12V4.2c0-.7.5-1.2 1.2-1.2h3l1.4 1.5h5.2c.7 0 1.2.5 1.2 1.2V7M1.6 12.2 3.4 7.6c.1-.4.5-.6.9-.6h9.9c.5 0 .8.5.6.9l-1.6 4.4c-.1.4-.5.7-.9.7H2.2c-.4 0-.7-.4-.6-.8z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',

  repo: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2h8a1 1 0 0 1 1 1v10.5h-8a1.5 1.5 0 0 1 0-3h8M5.8 4.5h4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m9.2 9.2 3.3 3.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  git: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="3.5" cy="3" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="3.5" cy="11" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="10.5" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 4.6v4.8M10.5 6.1c0 2.4-3 2-6 3.4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>',
  x: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  out: '<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><path d="M5 2.5H2.5v8h8V8M7.5 2.5h3v3M10.5 2.5 6 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  list: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3.5h10M2 7h10M2 10.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  expand: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m4 5 3-3 3 3M4 9l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  collapse: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m4 2 3 3 3-3M4 12l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 4.2V7l2 1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
};
const TYPES = {
  ts: ['TS', 'run'], tsx: ['TS', 'run'], js: ['JS', 'wait'], cjs: ['JS', 'wait'], mjs: ['JS', 'wait'], rs: ['RS', 'acc'], css: ['#', 'scr'],
  json: ['{}', 'wait'], md: ['M↓', 'mut'], html: ['<>', 'err'], svg: ['<>', 'done'], xml: ['<>', 'err'], kt: ['KT', 'scr'],
  toml: ['⚙', 'mut'], yml: ['⚙', 'mut'], yaml: ['⚙', 'mut'], png: ['▣', 'done'], ico: ['▣', 'done'], icns: ['▣', 'done'], jpg: ['▣', 'done'],
  pdf: ['PDF', 'err'], cmd: ['>_', 'mut'], sh: ['>_', 'mut'], zip: ['ZIP', 'mut'],
};
const LANG = { ts: 'typescript', tsx: 'typescript', js: 'javascript', cjs: 'javascript', mjs: 'javascript', rs: 'rust', css: 'css', json: 'json', md: 'markdown', html: 'xml', svg: 'xml', xml: 'xml', yml: 'yaml', yaml: 'yaml', toml: 'ini', sh: 'bash', kt: 'kotlin', py: 'python' };
const extOf = (p) => { const n = p.slice(p.lastIndexOf('/') + 1); return n.includes('.') ? n.slice(n.lastIndexOf('.') + 1).toLowerCase() : ''; };
function icon(p) {
  const t = TYPES[extOf(p)];
  return t ? `<span class="ico c-${t[1]}" aria-hidden="true">${esc(t[0])}</span>` : `<span class="ico c-mut" aria-hidden="true">${I.file}</span>`;
}

/* ---------- Daten: zwei Vorhaben ---------- */
const PHASEN = ['Plan Skins', 'Phase 1 — Statuszeile nennt das Werkzeug', 'Phase 2 — Speicher, Einstellungen und Bilder im Kern', 'Phase 3 — Figuren im Chat', 'Phase 4 — Einstellungsseite „Skins“', 'Phase 5 — Stil anwenden', 'Phase 6 — ZIP-Export und -Import', 'Phase 7 — Agenten-Werkzeuge skin_*', 'Phase 8 — Tipps und Easter Eggs'];
D.commits.forEach((c, i) => { c.session = i + 1; });
const FPD = window.FACEPASS || null;
const FP_AKTUELL = FPD ? FPD.sessions.find((x) => x.titel.startsWith('Phase 6')) || FPD.sessions[FPD.sessions.length - 1] : null;
const VORHABEN = {
  skins: {
    name: 'Skins – Figurenpakete und Stilpakete', aktuell: 9, laeuft: false,
    sessions: PHASEN.map((t, i) => ({ nr: i + 1, zeige: i + 1, rolle: i === 0 ? 'Planung' : 'Umsetzung', titel: t })),
    repos: [{ key: '0', name: 'Agenten-Verwalter-2000', stand: 'main', basis: 'main', behind: 0, voll: true, dateien: D.dateien.map((f) => f[0]), groesse: Object.fromEntries(D.dateien), aenderungen: D.aenderungen, commits: D.commits, log: D.branchLog, diffs: D.diffs, commitDiffs: D.commitDiffs, inhalt: D.inhalt, bilder: D.bilder, ignoriert: D.ignoriert || [] }],
  },
};
if (FPD) VORHABEN.facepass = { name: FPD.name, aktuell: FP_AKTUELL.nr, laeuft: true, sessions: FPD.sessions, repos: FPD.repos };

/* ---------- Zustand ---------- */
const S = { v: 'a', d: 'skins', t: 'dateien', m: 'geaendert', sicht: 'dateien', s: null, scope: 'alle', open: null, view: null, step: 'gesamt', page: 'start', pane: 'tree', th: 'system', q: '', qi: 0, reachOpen: false, searchOpen: false, openCommits: new Set() };
const EXP = {};
const V = () => VORHABEN[S.d];
const repoOf = (key) => V().repos.find((r) => r.key === key);
const sessionOf = (nr) => V().sessions.find((s) => s.nr === nr);
const treeMode = () => (S.v === 'b' ? (S.t === 'changes' ? 'geaendert' : 'alle') : S.m);
const leftKind = () => (S.v === 'c' ? S.sicht : 'dateien');
const inFilesTab = () => S.t === 'dateien' || S.t === 'changes';

function changesOf(repo) {
  if (S.scope === 'offen') return {};
  if (S.s === null) return repo.aenderungen;
  const out = {};
  for (const c of repo.commits) {
    if (c.session !== S.s) continue;
    for (const [p, [st, a, d]] of Object.entries(c.dateien)) {
      const o = out[p];
      out[p] = o ? [o[0] === 'A' ? 'A' : st, o[1] + a, o[2] + d] : [st, a, d];
    }
  }
  return out;
}
function totals() {
  let files = 0, add = 0, del = 0, commits = 0, neu = 0, weg = 0;
  for (const r of V().repos) {
    for (const [st, a, d] of Object.values(changesOf(r))) { files++; add += a; del += d; if (st === 'A') neu++; if (st === 'D') weg++; }
    if (S.scope !== 'offen') commits += r.commits.filter((c) => S.s === null || c.session === S.s).length;
  }
  return { files, add, del, commits, neu, weg, mod: files - neu - weg };
}
function expSet() {
  const id = S.d + '|' + treeMode();
  if (!EXP[id]) {
    const set = new Set();
    for (const r of V().repos) {
      set.add(r.key + ':');
      if (treeMode() === 'geaendert') for (const p of Object.keys(r.aenderungen)) { const parts = p.split('/'); for (let i = 1; i < parts.length && i <= 2; i++) set.add(r.key + ':' + parts.slice(0, i).join('/')); }
    }
    EXP[id] = set;
  }
  return EXP[id];
}
function reveal(key, path) {
  const set = expSet();
  set.add(key + ':');
  const parts = path.split('/');
  for (let i = 1; i < parts.length; i++) set.add(key + ':' + parts.slice(0, i).join('/'));
}

/* ---------- Baum ---------- */
function buildTree(paths, changes, ign) {
  const root = { dirs: new Map(), files: [], ign: [], n: 0, path: '' };
  const dirOf = (parts, upTo, changed) => {
    let node = root;
    for (let i = 0; i < upTo; i++) {
      let next = node.dirs.get(parts[i]);
      if (!next) { next = { dirs: new Map(), files: [], ign: [], n: 0, path: parts.slice(0, i + 1).join('/'), name: parts[i] }; node.dirs.set(parts[i], next); }
      node = next;
      if (changed) node.n++;
    }
    return node;
  };
  for (const p of paths) {
    const parts = p.split('/');
    const ch = Boolean(changes[p]);
    if (ch) root.n++;
    dirOf(parts, parts.length - 1, ch).files.push(parts[parts.length - 1]);
  }
  for (const raw of ign) {
    const dir = raw.endsWith('/');
    const parts = (dir ? raw.slice(0, -1) : raw).split('/');
    dirOf(parts, parts.length - 1, false).ign.push({ name: parts[parts.length - 1], dir });
  }
  return root;
}
const byName = (a, b) => a.localeCompare(b, 'de', { sensitivity: 'base' });
function walk(node, depth, rows, key, exp) {
  const dirs = [...node.dirs.values()].sort((a, b) => byName(a.name, b.name));
  for (let dir of dirs) {
    let label = dir.name;
    while (dir.files.length === 0 && dir.ign.length === 0 && dir.dirs.size === 1) { dir = [...dir.dirs.values()][0]; label += '/' + dir.name; }
    const open = exp.has(key + ':' + dir.path);
    rows.push({ kind: 'dir', label, path: dir.path, depth, open, n: dir.n });
    if (open) walk(dir, depth + 1, rows, key, exp);
  }
  for (const g of node.ign.filter((x) => x.dir).sort((a, b) => byName(a.name, b.name))) rows.push({ kind: 'ign', name: g.name, dir: true, depth });
  for (const f of node.files.sort(byName)) rows.push({ kind: 'file', name: f, path: (node.path ? node.path + '/' : '') + f, depth });
  for (const g of node.ign.filter((x) => !x.dir).sort((a, b) => byName(a.name, b.name))) rows.push({ kind: 'ign', name: g.name, dir: false, depth });
}
function standText(r) {
  return `Codebasis ${r.basis}${r.stand === r.basis ? '' : ' · ' + r.stand}`;
}
function renderTree() {
  const mode = treeMode();
  const exp = expSet();
  let html = `<div class="tree tree--${mode}" role="tree" aria-label="Dateien des Vorhabens">`;
  for (const r of V().repos) {
    const ch = changesOf(r);
    const n = Object.keys(ch).length;
    const sum = Object.values(ch).reduce((s, c) => [s[0] + c[1], s[1] + c[2]], [0, 0]);
    const open = exp.has(r.key + ':');
    const gitBtn = S.v === 'c' || (S.v === 'b' && S.t === 'dateien') ? '' : `<button class="btn btn--sm btn--quiet" data-act="git" data-k="${r.key}" title="Git-Werkzeuge für ${esc(r.name)}">${I.git} Git</button>`;
    html += `<div class="repo" role="treeitem" tabindex="0" aria-expanded="${open}" data-act="repo" data-k="${r.key}" title="${esc(r.name)} — Codebasis ${esc(r.basis)}, Branch ${esc(r.stand)}">${I.chev}${I.repo}<div class="repo__t"><div class="repo__nm">${esc(r.name)}</div><div class="repo__sub">${esc(standText(r))}</div></div>${n ? stat(sum[0], sum[1]) : '<span class="muted" style="font-size:12px">keine Änderungen</span>'}${gitBtn}</div>`;
    if (!open) continue;
    const paths = mode === 'alle' ? [...new Set([...r.dateien, ...Object.keys(ch)])] : Object.keys(ch);
    const rows = [];
    walk(buildTree(paths, ch, mode === 'alle' ? r.ignoriert || [] : []), 1, rows, r.key, exp);
    for (const row of rows) {
      if (row.kind === 'ign') {
        html += `<div class="row row--ign${row.dir ? ' row--dir' : ' row--file'}" role="treeitem" tabindex="-1" ${row.dir ? 'aria-expanded="false" ' : ''}data-act="ign" style="--d:${row.depth}" title="Von Git ignoriert${row.dir ? ' – wird erst beim Aufklappen gelesen' : ''}">${I.chev}${row.dir ? I.dir : icon(row.name)}<span class="nm">${esc(row.name)}</span><span class="ign">ignoriert</span></div>`;
        continue;
      }
      if (row.kind === 'dir') {
        html += `<div class="row row--dir${row.n ? ' is-ch' : ''}" role="treeitem" tabindex="-1" aria-expanded="${row.open}" data-act="dir" data-k="${r.key}" data-p="${esc(row.path)}" style="--d:${row.depth}" title="${esc(row.path)}">${I.chev}${row.open ? I.dirOpen : I.dir}<span class="nm">${esc(row.label)}</span>${row.n && (mode === 'alle' || !row.open) ? `<span class="cnt" title="${row.n} geänderte Dateien">${row.n}</span>` : ''}</div>`;
      } else {
        const c = ch[row.path];
        const sel = S.open && S.open.k === r.key && S.open.p === row.path;
        html += `<div class="row row--file${c ? ' is-ch' : ''}${sel ? ' is-sel' : ''}" role="treeitem" tabindex="-1" data-act="file" data-k="${r.key}" data-p="${esc(row.path)}" style="--d:${row.depth}" title="${esc(row.path)}">${I.chev}${icon(row.path)}<span class="nm">${esc(row.name)}</span>${c ? `${stat(c[1], c[2])}<span class="ltr ltr--${c[0]}" title="${{ A: 'Neu', M: 'Geändert', D: 'Gelöscht' }[c[0]]}">${c[0]}</span>` : ''}</div>`;
      }
    }
    if (mode === 'alle' && !r.voll) html += `<div class="note">Rest des Baums liegt dem Entwurf nicht vor (Daten aus dem Screenshot).</div>`;
    if (mode === 'geaendert' && n === 0 && S.scope === 'offen') html += `<div class="note">Nichts offen – alles committed.</div>`;
  }
  return html + '</div>';
}

/* ---------- Verlauf: wer, wann, was ---------- */
function renderVerlauf() {
  const sessions = V().sessions.slice().reverse();
  let html = '<div class="vl">';
  let any = false;
  for (const s of sessions) {
    if (S.s !== null && S.s !== s.nr) continue;
    const commits = [];
    for (const r of V().repos) for (const c of r.commits) if (c.session === s.nr) commits.push([r, c]);
    if (!commits.length || S.scope === 'offen') continue;
    any = true;
    html += `<div class="vl__s${S.s === s.nr ? ' is-on' : ''}"><div class="vl__h"><span class="vl__nr">#${s.zeige}</span><span class="vl__ti">${esc(s.rolle)} · ${esc(s.titel)}</span><span class="muted">${when(commits[0][1].zeit)}</span>${S.s === s.nr ? '' : `<button class="btn btn--sm btn--quiet" data-act="reach-set" data-s="${s.nr}">Nur diese Session</button>`}</div>`;
    for (const [r, c] of commits) {
      const id = r.key + '|' + c.id;
      const open = S.openCommits.has(id);
      const files = Object.entries(c.dateien);
      const sum = files.reduce((t, [, x]) => [t[0] + x[1], t[1] + x[2]], [0, 0]);
      html += `<button class="vl__c" aria-expanded="${open}" data-act="commit" data-id="${esc(id)}">${I.chev}<span class="pill">${c.betreff === null ? 'Commit' : esc(c.id)}</span><span class="sub" title="${esc((c.betreff || 'Commit') + ' — Branch ' + r.stand)}">${c.betreff === null ? '<span class="muted">Betreff im Screenshot nicht sichtbar</span>' : esc(c.betreff)}</span>${V().repos.length > 1 ? `<span class="muted" style="font-size:11.5px">${esc(r.name)}</span>` : ''}<span class="muted num">${files.length} Dateien</span>${stat(sum[0], sum[1])}</button>`;
      if (open) for (const [p, x] of files.sort((a, b) => byName(a[0], b[0]))) {
        html += `<button class="vl__f" data-act="vfile" data-k="${r.key}" data-p="${esc(p)}" data-c="${esc(c.id)}" title="${esc(p)}">${icon(p)}<span class="nm">&lrm;${esc(p)}</span>${stat(x[1], x[2])}<span class="ltr ltr--${x[0]}">${x[0]}</span></button>`;
      }
    }
    html += '</div>';
  }
  if (!any) html += `<div class="empty"><b>${S.scope === 'offen' ? 'Nichts offen' : 'Keine Commits'}</b>${S.scope === 'offen' ? 'Alles, was das Vorhaben geändert hat, ist committed.' : 'In dieser Auswahl hat keine Session etwas committet.'}</div>`;
  return html + '</div>';
}

/* ---------- Startseiten ---------- */
function renderFacts() {
  const t = totals();
  return `<div class="facts"><div><b>${nf(t.files)}</b><span>Dateien geändert</span></div><div><b>${nf(t.neu)}</b><span>neu</span></div><div><b>${nf(t.mod)}</b><span>bearbeitet</span></div><div><b>${nf(t.weg)}</b><span>gelöscht</span></div><div><b><span class="add">+${nf(t.add)}</span> <span class="del">−${nf(t.del)}</span></b><span>Zeilen</span></div><div><b>${nf(t.commits)}</b><span>Commits</span></div></div>`;
}
function renderBasis() {
  let rows = '';
  for (const r of V().repos) {
    const ch = changesOf(r);
    const commits = S.scope === 'offen' ? 0 : r.commits.filter((c) => S.s === null || c.session === S.s).length;
    rows += `<tr class="linkrow" data-act="git" data-k="${r.key}" title="Git-Werkzeuge öffnen"><td><b>${esc(r.name)}</b></td><td class="mono" data-l="Codebasis">${esc(r.basis)}</td><td data-l="Geändert">${nf(Object.keys(ch).length)} Dateien · ${nf(commits)} Commits</td><td data-l="Offen">alles committed</td><td data-l="Abgleich">${r.behind ? `<span class="dot dot--warn"></span>${r.behind} eingehend` : 'synchron'}</td><td class="mono muted" data-l="Branch">${esc(r.stand)}</td></tr>`;
  }
  return `<table class="grid grid--stack"><thead><tr><th>Repository</th><th>Codebasis</th><th>Geändert</th><th>Offen</th><th>Abgleich</th><th>Branch</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderStart() {
  const sess = S.s === null ? 'Ganzes Vorhaben' : `Session #${sessionOf(S.s).zeige} · ${sessionOf(S.s).rolle}`;
  if (S.v === 'b' && S.t === 'dateien') {
    return `<div class="page"><h2>Codebasis</h2>${renderBasis()}<div class="empty" style="padding-left:0"><b>Datei wählen</b>Im Baum links oder über die Suche (Strg P). Geänderte Dateien sind fett und tragen A, M oder D.</div></div>`;
  }
  return `<div class="page"><h2>${esc(sess)} · was sich geändert hat</h2>${renderFacts()}<h2>Codebasis</h2>${renderBasis()}${S.v === 'c' ? `<p style="margin-top:16px">Wer wann was geändert hat: Sicht <button class="btn btn--sm" data-act="sicht" data-v="verlauf">${I.clock} Verlauf</button> links.</p>` : `<h2>Verlauf · wer wann was geändert hat</h2>${renderVerlauf()}`}</div>`;
}
function renderGit(key) {

/* ---------- Datei: Änderung und ganze Datei ---------- */
function hl(text, lang) {
  if (lang && window.hljs && window.hljs.getLanguage(lang)) { try { return window.hljs.highlight(text, { language: lang, ignoreIllegals: true }).value; } catch (e) { /* ungefärbt */ } }
  return esc(text);
}
function splitLines(html) {

  const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)/g;
  while ((m = re.exec(html))) {
    if (m[1]) { open.push(m[1]); cur += m[1]; } else if (m[2]) { open.pop(); cur += m[2]; } else if (m[3]) { out.push(cur + '</span>'.repeat(open.length)); cur = open.join(''); } else cur += m[4];
  }

}
function parseDiff(text) {

}

const CACHE = {};

  const lang = LANG[extOf(path)];

  let html;

    if (text === undefined) html = `<div class="empty"><b>Kein Textvergleich</b>${bin ? 'Binärdatei – der Verwalter zeigt Größe und Vorschau statt eines Diffs.' : 'Für diese Datei ist im Entwurf kein Diff hinterlegt.'}</div>`;
    else {
      const { rows, cut } = parseDiff(text);
      html = '<table class="code"><tbody>' + rows.map((x) => x.t === 'h'
        ? `<tr class="h"><td class="no"></td><td class="no no2"></td><td class="sg"></td><td>${esc(x.text)}</td></tr>`
        : `<tr class="${x.t === 'c' ? '' : x.t}"><td class="no">${x.o || ''}</td><td class="no no2">${x.n || ''}</td><td class="sg">${x.t === 'a' ? '+' : x.t === 'd' ? '−' : ''}</td><td>${hl(x.text, lang) || ' '}</td></tr>`).join('') + '</tbody></table>' + (cut ? '<div class="note">Im Entwurf nach 2.500 Zeilen gekürzt.</div>' : '');
    }
  } else if (r.bilder[path]) {

  } else if (r.inhalt[path] === undefined) {
    html = `<div class="empty"><b>${bin ? 'Binärdatei – keine Vorschau' : 'Im Entwurf nicht hinterlegt'}</b>${bin ? 'Öffnen geht über „In VS Code öffnen“.' : 'Die Datendatei des Entwurfs lässt große Dateien, das Archiv und bei facepass alle unveränderten Dateien aus; der Verwalter zeigt sie.'}</div>`;
  } else {
    const lines = splitLines(hl(r.inhalt[path].replace(/\n$/, ''), lang));

    }).join('') + '</tbody></table>';

}

function chatLinks() {

/* ---------- Suche ---------- */
let RESULTS = [];
function searchFiles(q) {
  const ql = q.trim().toLowerCase();
  const out = [];
  for (const r of V().repos) {
    const ch = changesOf(r);
    if (!ql) { for (const c of r.commits.slice().reverse()) for (const p of Object.keys(c.dateien)) if (ch[p] && !out.some((o) => o.p === p && o.k === r.key)) out.push({ k: r.key, p, sc: 0, c: ch[p] }); continue; }
    for (const p of r.dateien) {
      const pl = p.toLowerCase();
      const name = pl.slice(pl.lastIndexOf('/') + 1);
      let sc = -1; let i = name.indexOf(ql);
      if (i >= 0) sc = 1000 - i - name.length * 0.1 + (i === 0 ? 200 : 0);
      else if ((i = pl.indexOf(ql)) >= 0) sc = 500 - i * 0.1;
      else { let k = 0; for (const chr of pl) { if (chr === ql[k]) k++; if (k === ql.length) break; } if (k === ql.length) sc = 100 - pl.length * 0.1; }
      if (sc >= 0) out.push({ k: r.key, p, sc: sc + (ch[p] ? 50 : 0), c: ch[p] });
    }
  }
  if (ql) out.sort((a, b) => b.sc - a.sc);

}

  if (S.v === 'c') head += `<div class="seg" role="group" aria-label="Sicht">${[['dateien', I.list + ' Dateien'], ['verlauf', I.clock + ' Verlauf'], ['git', I.git + ' Git']].map(([v, l]) => `<button data-act="sicht" data-v="${v}" aria-pressed="${S.sicht === v}">${l}</button>`).join('')}</div><span class="sp"></span>`;
  if (kind === 'dateien') {
    if (S.v !== 'b') head += `<div class="seg" role="group" aria-label="Umfang des Baums"><button data-act="mode" data-v="geaendert" aria-pressed="${S.m === 'geaendert'}">Geändert <span class="n">${nf(t.files)}</span></button><button data-act="mode" data-v="alle" aria-pressed="${S.m === 'alle'}">Alle Dateien <span class="n">${nf(Math.max(total, t.files))}</span></button></div>`;
    else head += `<span class="muted" style="font-size:12px">${S.t === 'changes' ? `${nf(t.files)} geänderte Dateien` : `${nf(Math.max(total, t.files))} Dateien`}</span>`;
    head += `<span class="sp"></span><button class="btn btn--sm btn--quiet" data-act="expand" title="${treeMode() === 'alle' ? 'Ordner mit Änderungen aufklappen' : 'Alle Ordner aufklappen'}" aria-label="${treeMode() === 'alle' ? 'Ordner mit Änderungen aufklappen' : 'Alle Ordner aufklappen'}">${I.expand}</button><button class="btn btn--sm btn--quiet" data-act="collapse" title="Alle Ordner einklappen" aria-label="Alle Ordner einklappen">${I.collapse}</button>`;
  }
  const body = kind === 'verlauf' ? renderVerlauf() : kind === 'git' ? renderGitList() : renderTree();
  const onStart = !S.open && S.page === 'start';
  left.innerHTML = `<button class="home${onStart ? ' is-on' : ''}" data-act="start" aria-current="${onStart ? 'page' : 'false'}">${I.clock}<span>Übersicht · Verlauf</span><span class="muted num">${nf(t.commits)} Commits</span></button><div class="left__head">${head}</div><div class="left__scroll">${body}</div>`;
  $('.left__scroll', left).scrollTop = top;
}
function renderDetail() {
  const el = $('#detail');
  if (S.open) el.innerHTML = renderFile();
  else if (S.page.startsWith('git:')) el.innerHTML = renderGit(S.page.slice(4));
  else { el.innerHTML = `<div class="fh only-narrow" style="border:0;padding-bottom:0"><button class="btn btn--sm" data-act="back">← Baum</button></div><div class="detail__scroll" data-start>${renderStart()}</div>`; $('[data-start]', el).scrollTop = S.startTop || 0; }
}
function render() {
  const startEl = $('#detail [data-start]');
  if (startEl) S.startTop = startEl.scrollTop;
  const oldCode = $('#codeScroll');
  const keep = oldCode ? { id: oldCode.dataset.id, top: oldCode.scrollTop, left: oldCode.scrollLeft } : null;
  document.documentElement.dataset.theme = S.th === 'system' ? '' : S.th;
  if (S.th === 'system') delete document.documentElement.dataset.theme;
  renderEbar(); renderHdr(); renderTb();
  const files = inFilesTab();
  $('#body').dataset.pane = S.pane;
  if (!files) {
    $('#left').innerHTML = ''; $('#left').style.display = 'none';
    $('#detail').style.display = 'flex';
    $('#detail').innerHTML = S.t === 'chat' ? renderChat() : `<div class="empty"><b>Artefakte</b>Unverändert – nicht Teil dieses Entwurfs.</div>`;
  } else {
    $('#left').style.display = ''; $('#detail').style.display = '';
    renderLeft(); renderDetail();
    const code = $('#codeScroll');
    const lineRow = code && S.line ? code.querySelector(`table.code tr:nth-child(${S.line})`) : null;
    if (lineRow) lineRow.classList.add('is-line');
    if (code && keep && keep.id === code.dataset.id) { code.scrollTop = keep.top; code.scrollLeft = keep.left; } else if (lineRow) lineRow.scrollIntoView({ block: 'center' });
  }
  renderPop(); renderResults(); writeHash();
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600);
}
function openFile(k, p, step, line) {
  const r = repoOf(k);
  const changed = Boolean(changesOf(r)[p]);
  if (!inFilesTab()) S.t = 'dateien';
  if (!changed && S.m === 'geaendert') S.m = 'alle';
  S.open = { k, p }; S.view = line ? 'datei' : step ? 'diff' : null; S.page = 'start'; S.pane = 'detail'; S.line = line || null;
  if (step) S.step = step;
  else {
    const mine = S.s === null ? [] : stepsOf(k, p).filter((c) => c.session === S.s);
    S.step = mine.length ? mine[mine.length - 1].id : 'gesamt';
  }
  reveal(k, p);
  render();
  const sel = $('.row.is-sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

/* ---------- Adresse ---------- */
function writeHash() {
  const p = new URLSearchParams();
  p.set('v', S.v); p.set('d', S.d); p.set('t', S.t); p.set('m', S.m);
  if (S.v === 'c') p.set('si', S.sicht);
  if (S.s !== null) p.set('s', S.s);
  if (S.scope !== 'alle') p.set('sc', S.scope);
  if (S.open) { p.set('f', S.open.k + '|' + S.open.p); if (S.view) p.set('vw', S.view); if (S.line) p.set('ln', S.line); if (S.step !== 'gesamt') p.set('st', S.step); } else if (S.page !== 'start') p.set('pg', S.page);
  if (S.th !== 'system') p.set('th', S.th);
  if (S.pane !== 'tree') p.set('pn', S.pane);
  const h = '#' + p.toString();
  if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) { /* eingebettet ohne Verlauf */ } }
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (VORHABEN[p.get('d')]) S.d = p.get('d');
  if (p.get('t')) S.t = p.get('t');
  if (p.get('m')) S.m = p.get('m');
  if (p.get('si')) S.sicht = p.get('si');
  S.s = p.get('s') ? Number(p.get('s')) : null;
  S.scope = p.get('sc') || 'alle';
  S.th = p.get('th') || 'system';
  S.pane = p.get('pn') || 'tree';
  S.page = p.get('pg') || 'start';
  const f = p.get('f');
  if (f) { const i = f.indexOf('|'); S.open = { k: f.slice(0, i), p: f.slice(i + 1) }; S.view = p.get('vw'); S.line = p.get('ln') ? Number(p.get('ln')) : null; S.step = p.get('st') || 'gesamt'; reveal(S.open.k, S.open.p); } else S.open = null;
  if (p.get('q') !== null) { S.q = p.get('q'); S.searchOpen = true; }
  if (p.get('pop')) S.reachOpen = true;
  if (S.v !== 'b' && S.t === 'changes') S.t = 'dateien';
}

/* ---------- Bedienung ---------- */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!ev.target.closest('#pop') && !(el && el.dataset.act === 'reach')) S.reachOpen = false;
  if (!ev.target.closest('.search') && !ev.target.closest('#results')) S.searchOpen = false;
  if (!el) { renderPop(); renderResults(); return; }
  if (el.disabled) return;
  const a = el.dataset.act; const v = el.dataset.v;
  if (a === 'variante') { S.v = v; if (v !== 'b' && S.t === 'changes') S.t = 'dateien'; if (v === 'b' && S.t === 'dateien' && !S.open) S.t = 'changes'; }
  else if (a === 'ign') { toast('Ignorierter Eintrag: der Verwalter liest ihn erst beim Aufklappen (im Entwurf nicht hinterlegt)'); return; }
  else if (a === 'chatlink') {
    const kind = el.dataset.kind;
    S.chatError = null;
    if (kind === 'file') { openFile(el.dataset.k, el.dataset.p, null, el.dataset.ln ? Number(el.dataset.ln) : null); return; }
    if (kind === 'such') { S.t = 'dateien'; S.q = el.dataset.q; S.qi = 0; S.searchOpen = true; render(); $('#q').focus(); toast('Mehrere Dateien heißen so – wähle eine'); return; }
    if (kind === 'extern') { toast('Öffnet im Standardprogramm, wie heute (im Entwurf ohne Wirkung)'); return; }
    S.chatError = `${el.dataset.p} liegt außerhalb des Vorhabens.`;
  }
  else if (a === 'daten') { S.d = v; S.startTop = 0; S.line = null; S.chatError = null; S.open = null; S.s = null; S.page = 'start'; S.q = ''; S.openCommits.clear(); }
  else if (a === 'thema') S.th = v;
  else if (a === 'info') { openInfo(); return; }
  else if (a === 'tab') { S.t = v; if (S.v === 'b') { S.view = null; } }
  else if (a === 'scope') S.scope = v;
  else if (a === 'reach') S.reachOpen = !S.reachOpen;
  else if (a === 'reach-set') { S.s = el.dataset.s === '' ? null : Number(el.dataset.s); S.reachOpen = false; S.step = 'gesamt'; }
  else if (a === 'mode') S.m = v;
  else if (a === 'sicht') { S.sicht = v; }
  else if (a === 'expand') {
    const set = expSet();
    for (const r of V().repos) { set.add(r.key + ':'); const src = Object.keys(changesOf(r)); for (const p of src) { const parts = p.split('/'); for (let i = 1; i < parts.length; i++) set.add(r.key + ':' + parts.slice(0, i).join('/')); } }
  } else if (a === 'collapse') { const set = expSet(); set.clear(); for (const r of V().repos) set.add(r.key + ':'); }
  else if (a === 'git') { ev.stopPropagation(); S.open = null; S.page = 'git:' + el.dataset.k; S.pane = 'detail'; }
  else if (a === 'repo' || a === 'dir') { const id = el.dataset.k + ':' + (el.dataset.p || ''); const set = expSet(); if (set.has(id)) set.delete(id); else set.add(id); render(); focusRow(el.dataset.k, el.dataset.p || '', a); return; }
  else if (a === 'file') { openFile(el.dataset.k, el.dataset.p); return; }
  else if (a === 'vfile') { openFile(el.dataset.k, el.dataset.p, el.dataset.c); return; }
  else if (a === 'commit') { const id = el.dataset.id; if (S.openCommits.has(id)) S.openCommits.delete(id); else S.openCommits.add(id); }
  else if (a === 'close') { S.open = null; S.page = 'start'; }
  else if (a === 'back') { S.pane = 'tree'; }
  else if (a === 'start') { S.open = null; S.page = 'start'; S.pane = 'detail'; }
  else if (a === 'view') S.view = v;
  else if (a === 'step') S.step = el.dataset.s;
  else if (a === 'crumb') { reveal(el.dataset.k, el.dataset.p ? el.dataset.p + '/x' : 'x'); if (S.v === 'c') S.sicht = 'dateien'; S.pane = 'tree'; render(); focusRow(el.dataset.k, el.dataset.p, el.dataset.p ? 'dir' : 'repo'); return; }
  else if (a === 'copy') { if (navigator.clipboard) navigator.clipboard.writeText(el.dataset.p).catch(() => {}); toast('Pfad kopiert'); return; }
  else if (a === 'noop') { toast(el.dataset.m); return; }
  else if (a === 'jump') { jump(Number(el.dataset.dir)); return; }
  else if (a === 'result') { const r = RESULTS[Number(el.dataset.i)]; S.searchOpen = false; S.q = ''; openFile(r.k, r.p); return; }
  render();
});
function focusRow(k, p, kind) {
  const sel = kind === 'repo' ? `.repo[data-k="${CSS.escape(k)}"]` : `.row[data-k="${CSS.escape(k)}"][data-p="${CSS.escape(p)}"]`;
  const row = $(sel);
  if (row) { row.focus({ preventScroll: true }); row.scrollIntoView({ block: 'nearest' }); }
}
let jumpAt = -1;
function jump(dir) {
  const rows = [...document.querySelectorAll('#codeScroll tr.h, #codeScroll tr.m-start')];
  if (!rows.length) { toast('Keine markierte Stelle in dieser Ansicht'); return; }
  jumpAt = (jumpAt + dir + rows.length) % rows.length;
  rows[jumpAt].scrollIntoView({ block: 'center' });
  toast(`Stelle ${jumpAt + 1} von ${rows.length}`);
}
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'q') { S.q = ev.target.value; S.qi = 0; S.searchOpen = true; renderResults(); }
  if (ev.target.id === 'reachQ') renderReachList(ev.target.value);
});
document.addEventListener('focusin', (ev) => { if (ev.target.id === 'q') { S.searchOpen = true; renderResults(); } });
document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'p') {
    ev.preventDefault();
    if (!inFilesTab()) { S.t = 'dateien'; render(); }
    const q = $('#q'); q.focus(); q.select();
    return;
  }
  if (ev.target.id === 'q') {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); S.qi = Math.min(RESULTS.length - 1, S.qi + 1); renderResults(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); S.qi = Math.max(0, S.qi - 1); renderResults(); }
    else if (ev.key === 'Enter' && RESULTS[S.qi]) { const r = RESULTS[S.qi]; S.searchOpen = false; S.q = ''; ev.target.blur(); openFile(r.k, r.p); }
    else if (ev.key === 'Escape') { S.searchOpen = false; ev.target.blur(); renderResults(); }
    return;
  }
  if (ev.key === 'Escape' && S.reachOpen) { S.reachOpen = false; renderPop(); return; }
  if (ev.key === 'Escape' && inFilesTab() && (S.open || S.page !== 'start') && !$('#info').open) { S.open = null; S.page = 'start'; render(); return; }
  const row = ev.target.closest && ev.target.closest('.row, .repo');
  if (!row) return;
  const rows = [...document.querySelectorAll('#left .row, #left .repo')];
  const i = rows.indexOf(row);
  const open = row.getAttribute('aria-expanded');
  if (ev.key === 'ArrowDown' && rows[i + 1]) { ev.preventDefault(); rows[i + 1].focus(); }
  else if (ev.key === 'ArrowUp' && rows[i - 1]) { ev.preventDefault(); rows[i - 1].focus(); }
  else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); }
  else if (ev.key === 'ArrowRight' && open === 'false') { ev.preventDefault(); row.click(); }
  else if (ev.key === 'ArrowLeft' && open === 'true') { ev.preventDefault(); row.click(); }
});

/* ---------- Info ---------- */
function openInfo() {
  const dlg = $('#info');
  dlg.innerHTML = `<div class="dlg"><button class="btn btn--sm btn--quiet dlg__x" data-close aria-label="Schließen">${I.x}</button>
  <h1>Repository-Ansicht · Entwurf</h1>
  <h2>Wofür</h2>
  <ul><li>Sehen, was das Vorhaben geändert hat – und wo das im Repository sitzt.</li><li>Jede Datei der Codebasis ansehen, nicht nur die geänderten.</li><li>Nachvollziehen, welche Session wann was geändert hat.</li></ul>
  <h2>Entschieden</h2>
  <ul><li>Reiter „Dateien“ ersetzt „Changes“; links der Baum, rechts Übersicht mit Verlauf.</li><li>„Übersicht · Verlauf“ steht fest über dem Baum; „← Übersicht“ oder Esc führt aus jeder Datei zurück.</li><li>Gesamtübersicht je Vorhaben: jedes Repository einmal, Änderungen aus allen Arbeitsordnern und Branches zusammengelegt. Der Branch ist Nebenangabe.</li><li>Dieselbe Datei auf zwei offenen Branches: einmal im Baum, jüngste Fassung vorn, die andere über „Geändert in“.</li><li>„Alle Dateien“ zeigt auch von Git Ignoriertes: grau, erst beim Aufklappen gelesen, nicht in der Suche. Ignorierte Ordner, die selbst Repository oder Arbeitsordner sind, erscheinen nicht noch einmal.</li><li>Dateilink im Chat: Datei des Vorhabens öffnet in „Dateien“, mit Zeile springt die Ansicht dorthin. Nur ein Dateiname: ein Treffer öffnet, mehrere öffnen die Suche. HTML und PDF öffnen im Standardprogramm, außerhalb des Vorhabens kommt die Fehlermeldung wie heute.</li><li>Suche oben rechts und mit Strg P – erst Dateinamen und Pfade, Volltext als zweite Stufe.</li><li>Standard ist das ganze Vorhaben; eine Session ist ein Filter.</li></ul>
  <h2>Linux-Abnahme am Gerät</h2>
  <ul><li>Namen, die sich nur in Groß- und Kleinschreibung unterscheiden, bleiben zwei Dateien.</li><li>Symbolische Links erscheinen als Link und führen nicht aus dem Repository hinaus.</li><li>Nur Dateirechte geändert: Hinweis statt leerem Diff.</li><li>Strg P öffnet die Suche, nicht den Druckdialog.</li><li>„In VS Code öffnen“ und „Im Dateimanager zeigen“ laufen; fehlt VS Code, kommt eine Meldung.</li><li>Dateinamen mit Doppelpunkt oder Rückstrich lassen sich öffnen und verlinken.</li><li>„Link-Adresse kopieren“ am Dateilink liefert auch für Pfade wie /home/… eine Adresse (heute nur für Windows-Pfade).</li></ul>
  <h2>Beispieldaten</h2>
  <ul><li><b>Skins:</b> echter Baum, echte Commits und Diffs aus dem Verwalter-Repository. Die Session-Nummern sind Beispiel (ein Commit je Phase).</li><li>Ein zweites Beispiel mit mehreren Repositories erscheint nur, wenn seine Datendatei lokal vorliegt; sie gehört nicht ins Repository.</li><li>Der Text im Chat ist Beispiel, die Pfade darin sind echt.</li></ul>
  <h2>Offen</h2>
  <ul><li>Zustände „lädt“ und „Repository nicht lesbar“.</li><li>Commits, die es im Repository nicht mehr gibt (in facepass gemessen 30 von 1.088), als eigene Zeile im Verlauf.</li><li>Review-Kommentare an Zeilen bleiben wie heute, sind hier nicht gezeichnet.</li></ul></div>`;
  dlg.showModal();
}
$('#info').addEventListener('click', (ev) => { if (ev.target.closest('[data-close]') || ev.target === $('#info')) $('#info').close(); });

const WANT_INFO = Boolean(new URLSearchParams(location.hash.slice(1)).get('info'));
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash();
render();
{ const sel = $('.row.is-sel'); if (sel) sel.scrollIntoView({ block: 'center' }); }
if (WANT_INFO) openInfo();
</script>
