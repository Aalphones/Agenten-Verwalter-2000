<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Session-Dateien</title>
<style>
:root {
  --bg: #ffffff; --bg-side: #f8f8f8; --bg-surface: #ffffff; --bg-hover: #f0f0f0; --bg-selected: #e4e6f1;
  --border-subtle: #e5e5e5; --border: #cecece;
  --fg: #3c3c3c; --fg-2: #555555; --muted: #6e6e6e;
  --accent: #c4572f; --accent-text: #a8461f; --on-accent: #ffffff;
  --running: #2563eb; --waiting: #8a5700; --error: #c5352e; --done: #16803c; --script: #7c3aed;
  --add: #15773a; --delc: #c5352e; --add-bg: #e8f6ee; --del-bg: #fdeceb; --hunk-bg: #f3f3f6;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.14); --scrim: rgb(0 0 0 / 0.28);
  --delc-strong: #a82720; --running-strong: #1b4bc4; --done-strong: #116330; --script-strong: #6d28d9;
  --sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1f1f; --bg-side: #181818; --bg-surface: #252526; --bg-hover: #2e2e30; --bg-selected: #37373d;
  --border-subtle: #2b2b2b; --border: #3c3c3c;
  --fg: #d4d4d4; --fg-2: #b0b0b0; --muted: #8f8f8f;
  --accent: #e0825c; --accent-text: #eea283; --on-accent: #1d130e;
  --running: #5b9dff; --waiting: #f2b33d; --error: #f47067; --done: #4cc38a; --script: #a78bfa;
  --add: #4cc38a; --delc: #f47067; --add-bg: #243129; --del-bg: #362827; --hunk-bg: #242428;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.45); --scrim: rgb(0 0 0 / 0.55);
  --delc-strong: #ff9088; --running-strong: #82b4ff; --done-strong: #4cc38a; --script-strong: #bcaaff;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1f1f1f; --bg-side: #181818; --bg-surface: #252526; --bg-hover: #2e2e30; --bg-selected: #37373d;
  --border-subtle: #2b2b2b; --border: #3c3c3c;
  --fg: #d4d4d4; --fg-2: #b0b0b0; --muted: #8f8f8f;
  --accent: #e0825c; --accent-text: #eea283; --on-accent: #1d130e;
  --running: #5b9dff; --waiting: #f2b33d; --error: #f47067; --done: #4cc38a; --script: #a78bfa;
  --add: #4cc38a; --delc: #f47067; --add-bg: #243129; --del-bg: #362827; --hunk-bg: #242428;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.45); --scrim: rgb(0 0 0 / 0.55);
  --delc-strong: #ff9088; --running-strong: #82b4ff; --done-strong: #4cc38a; --script-strong: #bcaaff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--running); outline-offset: 1px; }
.row:hover, .row.is-sel, .seg button:hover, .seg button[aria-pressed="true"], .pop__i:hover, .pop__i[aria-selected="true"] { --muted: var(--fg-2); --error: var(--delc-strong); --running: var(--running-strong); --done: var(--done-strong); --script: var(--script-strong); }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.num { font: 11.5px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Entwurfsleiste */
.ebar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 12px; background: var(--bg-side); border-bottom: 1px solid var(--border); font-size: 12px; }
.ebar__t { font-weight: 600; }
.ebar__g { display: flex; align-items: center; gap: 4px; }
.ebar__g > span { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--bg-surface); border: 0; border-right: 1px solid var(--border); padding: 3px 10px; min-height: 26px; font-size: 12.5px; color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--bg-hover); }
.seg button[aria-pressed="true"] { background: var(--bg-selected); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.btn { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; min-height: 28px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { color: var(--muted); cursor: not-allowed; border-style: dashed; }
.btn[disabled]:hover { border-color: var(--border); }
.btn[disabled]:active { transform: none; }
.btn--quiet { border-color: transparent; background: none; color: var(--fg-2); }
.btn--quiet:hover { background: var(--bg-hover); border-color: transparent; }
.btn--sm { min-height: 24px; padding: 1px 8px; font-size: 12px; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn--on { border-color: var(--accent); background: var(--bg-selected); font-weight: 600; }

/* App-Rahmen */
.app { flex: 1; min-height: 0; display: flex; flex-direction: column; container: app / inline-size; position: relative; }
.hdr { display: flex; align-items: center; gap: 6px 14px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.crumbs { color: var(--fg-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
.crumbs b { color: var(--fg); font-weight: 600; }
.tabs button { min-height: 30px; font-size: 13px; padding: 3px 14px; }
.tb { display: flex; align-items: center; gap: 6px 12px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.tb__sum { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; }
.search { margin-left: auto; position: relative; flex: 1 1 220px; max-width: 340px; min-width: 160px; }
.search input { width: 100%; height: 28px; padding: 0 52px 0 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-surface); }
.search input::placeholder { color: var(--muted); }
.search > svg { position: absolute; left: 8px; top: 7px; color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 6px; top: 5px; font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; pointer-events: none; }
.body { flex: 1; min-height: 0; display: flex; position: relative; }
.left { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); background: var(--bg-side); min-height: 0; }
.home { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-left: 2px solid transparent; border-bottom: 1px solid var(--border-subtle); background: none; text-align: left; font-weight: 600; min-height: 34px; }
.home:hover { background: var(--bg-hover); }
.home.is-on { background: var(--bg-selected); border-left-color: var(--accent); }
.left__head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.left__head .sp { flex: 1; }
.left__scroll { flex: 1; overflow: auto; min-height: 0; }
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; container: detail / inline-size; }
.detail__scroll { flex: 1; overflow: auto; min-height: 0; }
.page { padding: 16px 20px 40px; max-width: 980px; }
.page h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
.page p { margin: 4px 0; color: var(--fg-2); }
.only-narrow { display: none !important; }

/* Baum */
.repo { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px; border: 0; border-top: 1px solid var(--border-subtle); position: sticky; top: 0; background: var(--bg-side); z-index: 2; text-align: left; }
.repo:first-child { border-top: 0; }
.repo:hover { background: var(--bg-hover); }
.repo__t { flex: 1; min-width: 0; }
.repo__nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.repo__sub { font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.chev { width: 12px; height: 12px; transition: transform 120ms; color: var(--muted); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.row { position: relative; display: flex; align-items: center; gap: 5px; width: 100%; height: 24px; padding: 0 8px 0 calc(8px + var(--d, 0) * 14px); border: 0; border-left: 2px solid transparent; background: none; white-space: nowrap; font-size: 12.5px; text-align: left; }
.row::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: calc(var(--d, 0) * 14px); background: repeating-linear-gradient(90deg, var(--border) 0 1px, transparent 1px 14px); pointer-events: none; opacity: 0.7; }
.row:hover { background: var(--bg-hover); }
.row.is-sel { background: var(--bg-selected); border-left-color: var(--accent); }
.row:focus-visible { outline-offset: -2px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row--file .chev { visibility: hidden; }
.row--grp { height: 28px; }
.row--grp .nr { font: 700 12px var(--mono); }
.row--grp .nm { font-weight: 600; }
.row--loc .nm { color: var(--fg-2); font-weight: 600; font-size: 12px; }
.row--dir .nm { color: var(--fg-2); }
.row--far .nm { font: 11.5px var(--mono); color: var(--fg-2); direction: rtl; text-align: left; }
.row--gone .nm { color: var(--muted); font-style: italic; }
.row--more { color: var(--muted); font-size: 12px; cursor: default; }
.row--more:hover { background: none; }
.ltr { width: 14px; text-align: center; font: 700 11px var(--mono); }
.ltr--A { color: var(--add); } .ltr--M { color: var(--fg); }
.cnt { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 5px; line-height: 15px; }
.tag { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tag--own { color: var(--accent-text); }
.ico { width: 22px; text-align: center; font: 700 9px var(--mono); letter-spacing: -0.3px; flex-shrink: 0; }
.c-run { color: var(--running); } .c-wait { color: var(--waiting); } .c-acc { color: var(--accent-text); } .c-scr { color: var(--script); }
.c-err { color: var(--error); } .c-done { color: var(--done); } .c-mut { color: var(--muted); }
.note { padding: 6px 12px 8px 30px; color: var(--muted); font-size: 12px; white-space: normal; }
.note--err { color: var(--error); }

/* Datei */
.fh { display: flex; align-items: center; gap: 6px 10px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.fh__path { flex: 1 1 260px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; font-size: 12.5px; }
.fh__path span { color: var(--fg-2); padding: 1px 3px; }
.fh__path b { padding: 1px 3px; overflow-wrap: anywhere; }
.fh__path i { color: var(--muted); font-style: normal; }
.fh__act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; padding: 5px 12px; border-bottom: 1px solid var(--border-subtle); font-size: 12px; color: var(--fg-2); }
.meta__where { font: 11.5px var(--mono); color: var(--muted); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 0 1 auto; }
.meta__lock { color: var(--waiting); display: inline-flex; align-items: center; gap: 4px; }
.code { font: 12px/1.5 var(--mono); border-collapse: collapse; min-width: 100%; tab-size: 4; }
.code td { padding: 0 10px 0 6px; white-space: pre; vertical-align: top; }
.code .no { position: sticky; left: 0; background: var(--bg); color: var(--muted); text-align: right; user-select: none; width: 46px; min-width: 46px; max-width: 46px; padding: 0 6px; }
.code .cm { color: var(--done); }
.frame { margin: 14px; border: 1px solid var(--border-subtle); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 260px; background: var(--bg); }
.frame__bar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--border-subtle); background: var(--bg-side); }
.frame__bar .sp { flex: 1; }
.frame__in { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; background: repeating-conic-gradient(var(--bg-hover) 0% 25%, var(--bg) 0% 50%) 50% / 16px 16px; min-height: 220px; }
.frame__in img { max-width: 100%; max-height: 60vh; border: 1px solid var(--border); }
.frame__in--plain { background: var(--bg); }
.video { width: min(560px, 100%); aspect-ratio: 16 / 9; background: #111; border-radius: 6px; display: flex; flex-direction: column; justify-content: flex-end; color: #ddd; }
.video__ctl { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font: 11.5px var(--mono); background: linear-gradient(transparent, rgb(0 0 0 / 0.6)); }
.video__bar { flex: 1; height: 4px; background: #555; border-radius: 2px; position: relative; }
.video__bar::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 28%; background: #eee; border-radius: 2px; }
.pdfpage { width: min(420px, 100%); aspect-ratio: 1 / 1.414; background: #fff; color: #222; box-shadow: 0 1px 4px rgb(0 0 0 / 0.25); padding: 28px 30px; font: 11px/1.6 var(--sans); }
.pdfpage h3 { font-size: 15px; margin: 0 0 10px; }
.pdfpage div { height: 7px; background: #e3e3e3; border-radius: 2px; margin: 7px 0; }
.md { max-width: 720px; padding: 16px 20px 40px; line-height: 1.6; }
.md h1 { font-size: 18px; margin: 0 0 8px; } .md h2 { font-size: 14px; margin: 18px 0 6px; }
.md code { font: 12px var(--mono); background: var(--hunk-bg); padding: 1px 4px; border-radius: 4px; }
.rest { margin: 18px; max-width: 520px; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px 16px; }
.rest h3 { margin: 0 0 6px; font-size: 14px; }
.rest dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 8px 0 12px; font-size: 12.5px; }
.rest dt { color: var(--muted); } .rest dd { margin: 0; overflow-wrap: anywhere; }
.rest p { margin: 6px 0; color: var(--fg-2); }
.empty { padding: 28px 20px; color: var(--fg-2); max-width: 560px; }
.empty b { display: block; color: var(--fg); font-size: 14px; margin-bottom: 4px; }

/* Chat */
.chat { max-width: 780px; padding: 16px 20px 40px; }
.chat__u { background: var(--bg-hover); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px auto; width: fit-content; max-width: 80%; }
.chat__a p { margin: 8px 0; line-height: 1.7; }
.flink { font: 12px var(--mono); background: var(--hunk-bg); border: 0; border-radius: 4px; padding: 1px 5px; color: var(--accent-text); text-decoration: underline; overflow-wrap: anywhere; text-align: left; }
.flink:hover { background: var(--bg-selected); }

/* Artefakte (Ausschnitt) */
.arts { display: flex; flex: 1; min-height: 0; }
.arts__list { width: 300px; border-right: 1px solid var(--border-subtle); background: var(--bg-side); padding: 6px 0; }
.arts__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* Auswahl, Dialog, Toast */
.anchor { position: relative; height: 0; }
.pop { position: absolute; left: 12px; top: 0; width: min(400px, calc(100cqw - 24px)); max-height: min(60vh, 440px); overflow: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 30; padding: 4px 0; }
.pop__i { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 5px 10px; border: 0; border-left: 2px solid transparent; background: none; text-align: left; min-height: 28px; }
.pop__i:hover { background: var(--bg-hover); }
.pop__i[aria-selected="true"] { background: var(--bg-selected); border-left-color: var(--accent); font-weight: 600; }
.pop__i .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-surface); color: var(--fg); padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--scrim); }
.dlg { padding: 16px 20px 18px; }
.dlg h1 { font-size: 16px; margin: 0 0 8px; }
.dlg h2 { font-size: 13px; margin: 14px 0 4px; }
.dlg ul { margin: 2px 0; padding-left: 18px; }
.dlg li { margin: 3px 0; }
.dlg__x { float: right; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; z-index: 60; font-size: 12.5px; max-width: calc(100vw - 24px); }
.toast[hidden] { display: none; }
#err { background: var(--del-bg); color: var(--fg); padding: 4px 12px; font: 12px var(--mono); white-space: pre-wrap; }
#err:empty { display: none; }

@container app (max-width: 780px) {
  .left { width: 100%; border-right: 0; }
  .body[data-pane="tree"] .detail { display: none; }
  .body[data-pane="detail"] .left { display: none; }
  .only-narrow { display: inline-flex !important; }
  .search { max-width: none; flex-basis: 100%; }
  .arts__list { display: none; }
}
.lbl-short { display: none; }
@container detail (max-width: 600px) {
  .fh__act .btn .lbl-long { display: none; }
  .fh__act .btn .lbl-short { display: inline; }
}
@media (pointer: coarse) { .row { height: 44px; } .btn, .seg button, .pop__i, .home { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  const l = (id, text) => `<a href="#" class="flink" data-link="${id}" title="${id === 'art' ? 'In Artefakte öffnen' : 'In Dateien öffnen'}: ${esc(text)}">${esc(text)}</a>`;
  return `<div class="detail__scroll"><div class="chat">
    <div class="chat__u">Liste mir die Befehle hier auf …</div>
    <div class="chat__a">
      <p>Die Befehle stehen in ${l('f4', WS + '\\.scratchpad\\d571d992-b331-4d94-9f6d-ef0bd276feba\\nachweis-labor01.sh')}.</p>
      <p>Das Video zum Ablauf liegt unter ${l('f5', 'C:\\Users\\nutzer\\Downloads\\management-interface.mp4')} <span class="muted">(Beispiel)</span>, das Protokoll vom letzten Versuch unter ${l('f6', 'C:\\Users\\nutzer\\AppData\\Local\\Temp\\restore-labor.log')}.</p>
      <p>Den Vorschlag habe ich als Artefakt abgelegt: ${l('art', '.artefakte\\vorschlag-session-dateien.md')}; geändert ist ${l('r1', 'src-tauri/src/file_links/mod.rs:15')}.</p>
    </div></div></div>`;
}
function renderArts() {
  const a = (n, k, on) => `<button type="button" class="row row--file${on ? ' is-sel' : ''}" style="--d:0">${chev}${icon(k)}<span class="nm">${n}</span></button>`;
  const cmd = st.artSel === 'cmd';
  return `<div class="arts"><div class="arts__list">${a('vorschlag-session-dateien.md', 'markdown', !cmd).replace('class="row', 'data-art="md" class="row')}${a('pruefen.cmd', 'code', cmd).replace('class="row', 'data-art="cmd" class="row')}</div>
    <div class="arts__main"><div class="fh"><span class="fh__path"><b>${cmd ? 'pruefen.cmd' : 'vorschlag-session-dateien.md'}</b></span><span class="fh__act"><button type="button" class="btn btn--sm"${cmd ? ' disabled aria-describedby="lock2"' : ''} data-act="open">Mit Standardprogramm öffnen</button><button type="button" class="btn btn--sm" data-act="reveal">Im Explorer zeigen</button></span></div>
    ${cmd ? '<div class="meta"><span class="meta__lock" id="lock2">⚠ Standardprogramm gesperrt: würde das Skript ausführen</span></div>' : ''}
    <div class="detail__scroll">${cmd ? codeTable([['@echo off', 0], ['rem Prüfkette lokal', 1], ['call pnpm check', 0]]) : '<div class="md"><h1>Vorschlag: Session-Dateien im Reiter „Dateien“</h1><p>Stand 2026-11-25 · Analyse gegen <code>main</code> (v0.70.0) des Agenten-Verwalters.</p><h2>Warum dein Link nicht aufging</h2><p>Ein Klick auf einen Dateilink fragt den Kern, wohin er führt. …</p></div>'}</div></div></div>`;
}
function render() {
  document.documentElement.dataset.theme = st.theme === 'auto' ? '' : st.theme;
  if (st.theme === 'auto') delete document.documentElement.dataset.theme;
  renderBar(); renderHdr();
  const main = document.getElementById('main');
  main.innerHTML = st.view === 'chat' ? renderChat() : st.view === 'arts' ? renderArts() : renderFiles();
  writeHash();
}

/* ---------- Bedienung ---------- */
function openFile(id) {
  const f = fileById(id);
  if (f && !f.path) { st.exp.add('sf'); st.exp.add('g:' + f.s); st.exp.add(`l:${f.s}:${f.loc}`); if (f.dir) st.exp.add(`d:${f.s}:${f.loc}:${f.dir}`); }
  if (st.filter && f && f.s && f.s !== st.filter) st.filter = null;
  st.open = id; st.pane = 'detail'; st.view = 'files'; st.mdMode = 'text';
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, a[data-link]');
  if (t && t.tagName === 'A') ev.preventDefault();
  if (!t) { if (st.picker && !ev.target.closest('.pop')) { st.picker = false; render(); } return; }
  const d = t.dataset;
  if (d.e === 'info') { info(); return; }
  if (d.e) { st[d.e] = d.v; if (d.e === 'state' && d.v === 'empty') st.open = null; render(); return; }
  if (d.tab) { st.view = d.tab; render(); return; }
  if (d.tog) { st.exp.has(d.tog) ? st.exp.delete(d.tog) : st.exp.add(d.tog); render(); return; }
  if (d.open) { openFile(d.open); render(); return; }
  if (d.home) { st.open = null; st.pane = 'detail'; render(); return; }
  if (d.back) { st.pane = 'tree'; render(); return; }
  if (d.md) { st.mdMode = d.md; render(); return; }
  if (d.picker) { st.picker = !st.picker; render(); return; }
  if (d.pick !== undefined) { st.filter = d.pick || null; st.picker = false; if (st.filter) { st.exp.add('sf'); st.exp.add('g:' + st.filter); } render(); return; }
  if (d.art) { st.artSel = d.art; render(); return; }
  if (d.link) {
    if (d.link === 'art') { st.view = 'arts'; st.artSel = 'md'; render(); toast('Artefakt im Reiter „Artefakte“ geöffnet'); return; }
    openFile(d.link); render(); return;
  }
  if (d.act === 'reveal') { toast('Explorer öffnet den Ordner und markiert die Datei'); return; }
  if (d.act === 'open') { toast('Datei öffnet im Standardprogramm'); return; }
  if (d.act === 'code') { toast('Datei öffnet in VS Code'); return; }
  if (d.act === 'copy') { toast('Pfad kopiert'); return; }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { if (st.picker) st.picker = false; else st.open = null; render(); } });
function info() {
  const dlg = document.getElementById('info');
  dlg.innerHTML = `<div class="dlg"><button type="button" class="btn btn--sm btn--quiet dlg__x" onclick="this.closest('dialog').close()">Schließen</button><h1>Wofür</h1>
    <p>Jede Datei sehen, die eine Session des Vorhabens angelegt, in den Scratchpad gelegt oder im Chat verlinkt hat — und sie in der App ansehen.</p>
    <h2>Häufigste Aufgabe</h2><ul><li>Link im Chat anklicken → Datei steht rechts, links markiert.</li><li>Seltener: im Knoten stöbern, was eine Station hinterlassen hat.</li></ul>
    <h2>Regeln</h2><ul>
      <li>Knoten „Session-Dateien“ unter den Repositories; fehlt, wenn keine Session eine Datei hat.</li>
      <li>Je Session eine Gruppe, darin die Orte Scratchpad, Scratchpad Kommandozeile, Weitere Orte.</li>
      <li>„Weitere Orte“ gruppiert nach Ordner (voller Pfad, links gekürzt).</li>
      <li>„verlinkt“: nur im Chat genannt, nicht von der Session geschrieben.</li>
      <li>Dateien in Repositories stehen dort, Artefakte im Reiter „Artefakte“ — nicht doppelt hier.</li>
      <li>Session-Filter der Leiste wirkt auch hier; „Blickwinkel“ und „Geändert/Alle“ nicht (keine Git-Dateien).</li>
      <li>Bild, Video, Ton, PDF: Betrachter wie im Reiter „Artefakte“ — auch für Dateien in Repositories.</li>
      <li>Markdown, CSV, JSON, YAML, XML: Text, Schalter „Vorschau“.</li>
      <li>Vier Knöpfe an jeder Datei; „Mit Standardprogramm öffnen“ gesperrt für ausführbare Typen.</li>
    </ul>
    <h2>Was Beispiel ist</h2><ul><li>Echt: Scratchpad-Ordner, Dateinamen und Anzahlen aus einem Vorhaben, Inhalt von <span class="mono">nachweis-labor01.sh</span>, das Bild.</li><li>Beispiel: Session-Nummern und -Namen, Video, PDF, Dateien unter Downloads/Dokumente, Uhrzeiten.</li></ul></div>`;
  dlg.showModal();
}
readHash();
render();
</script>
