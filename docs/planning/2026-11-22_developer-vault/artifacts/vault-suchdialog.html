<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf: Vault-Suche – drei Vorschläge (Developer Vault, Phase 6)</title>
<style>
/* Tokens: Hex-Werte aus src/styles/theme.css (Stand 2026-11-23); Namen gekürzt. */
:root {
  --bg-base:#fff; --bg-sidebar:#f8f8f8; --bg-popover:#fff; --bg-hover:#f0f0f0; --bg-selected:#e4e6f1;
  --border-subtle:#e5e5e5; --border:#cecece; --fg:#3c3c3c; --fg-2:#555; --fg-muted:#6e6e6e;
  --accent:#c4572f; --accent-strong:#a8461f; --on-accent:#fff; --accent-subtle:rgb(196 87 47 / .10); --accent-text:#a8461f;
  --toggle-on:#c4572f; --toggle-off:#c8c8c8; --on-toggle:#fff;
  --error:#d23b33; --error-subtle:#fdeceb; --waiting:#a86a00; --scrim:rgb(0 0 0 / .28);
  --shadow:0 10px 30px rgb(0 0 0 / .14); --bar-bg:#f3f3f6;
  --font-sans:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --font-mono:'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg-base:#1f1f1f; --bg-sidebar:#181818; --bg-popover:#252526; --bg-hover:#2e2e30; --bg-selected:#37373d;
  --border-subtle:#2b2b2b; --border:#3c3c3c; --fg:#d4d4d4; --fg-2:#b0b0b0; --fg-muted:#8f8f8f;
  --accent:#e0825c; --accent-strong:#e0825c; --on-accent:#1d130e; --accent-subtle:rgb(224 130 92 / .16); --accent-text:#eea283;
  --toggle-on:#e0825c; --toggle-off:#4a4a4f; --on-toggle:#f5f5f5;
  --error:#f47067; --error-subtle:rgb(244 112 103 / .11); --waiting:#f2b33d; --scrim:rgb(0 0 0 / .55);
  --shadow:0 10px 30px rgb(0 0 0 / .45); --bar-bg:#181818;
  color-scheme: dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg-base); color:var(--fg); font:13px/1.45 var(--font-sans); }
button, input, select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }
kbd { font:11px var(--font-mono); color:var(--fg-muted); }
.keys kbd { padding:0 4px; border:1px solid var(--border); border-radius:4px; }
svg { flex-shrink:0; }

/* ================= Entwurfsleiste (gehört nicht zur App) ================= */
.bar { position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:8px 14px; background:var(--bar-bg); border-bottom:1px solid var(--border); }
.bar label { display:flex; align-items:center; gap:6px; color:var(--fg-2); }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.seg button { height:28px; padding:0 10px; border:0; border-left:1px solid var(--border); background:var(--bg-base); cursor:pointer; color:var(--fg-2); }
.seg button:first-child { border-left:0; }
.seg button[aria-pressed="true"] { background:var(--bg-selected); color:var(--fg); font-weight:600; box-shadow:inset 0 -2px 0 var(--accent); }
.dsel { position:relative; }
.dsel__btn { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 8px 0 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-base); cursor:pointer; }
.dsel__btn::after { content:""; width:6px; height:6px; margin-left:2px; border-right:1.5px solid var(--fg-muted); border-bottom:1.5px solid var(--fg-muted); transform:translateY(-2px) rotate(45deg); }
.dsel__menu { position:absolute; left:0; top:32px; z-index:95; min-width:100%; margin:0; padding:4px; list-style:none; border:1px solid var(--border); border-radius:8px; background:var(--bg-popover); box-shadow:var(--shadow); }
.dsel__menu li { padding:5px 10px; border-radius:6px; white-space:nowrap; cursor:pointer; }
.dsel__menu li:hover, .dsel__menu li[aria-selected="true"] { background:var(--bg-hover); }
.dsel__menu li[aria-selected="true"]::before { content:"✓ "; color:var(--accent-text); }
.bar__btn { height:28px; padding:0 10px; border:1px solid var(--border); border-radius:6px; background:transparent; cursor:pointer; }
.bar__btn:hover { background:var(--bg-hover); }
.bar__info { width:28px; padding:0; }
.bar__tag { margin-left:auto; color:var(--fg-muted); font-size:12px; }
.bar__pop { position:absolute; top:100%; right:14px; z-index:96; width:min(30rem,calc(100% - 28px)); padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--bg-popover); box-shadow:var(--shadow); }
.bar__pop h4 { margin:0 0 4px; font-size:13px; }
.bar__pop ul { margin:0 0 10px; padding-left:18px; } .bar__pop ul:last-child { margin:0; }
.stagewrap { display:flex; justify-content:center; padding:12px; }
.stage { container:stage / inline-size; position:relative; display:flex; width:100%; height:min(740px, calc(100vh - 96px)); min-height:580px; overflow:hidden; border:1px solid var(--border); border-radius:8px; background:var(--bg-base); }
.tools { margin:0 12px 12px; padding:8px 12px; border:1px solid var(--border-subtle); border-radius:8px; font:12px var(--font-mono); color:var(--fg-2); }
.tools b { font-family:var(--font-sans); color:var(--fg); }

/* ================= App: Sidebar wie src/app/Sidebar.css ================= */
.sidebar { display:flex; flex-direction:column; width:256px; flex-shrink:0; border-right:1px solid var(--border-subtle); background:var(--bg-sidebar); }
.sidebar__brand { display:flex; align-items:center; gap:10px; height:48px; padding:0 16px; flex-shrink:0; }
.sidebar__brand-name { font-weight:600; }
.sidebar__actions { display:flex; flex-direction:column; gap:6px; padding:2px 10px 10px; flex-shrink:0; }
.sidebar__new { display:flex; align-items:center; gap:8px; width:100%; height:30px; padding:0 10px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; }
.sidebar__new:hover { background:var(--bg-hover); }
.sidebar__new-label { flex-grow:1; text-align:left; }
.sidebar__find { color:var(--fg-muted); }
.sidebar__find .sidebar__new-label { color:var(--fg-muted); }
.sidebar__list { flex-grow:1; min-height:0; overflow-y:auto; padding:2px 10px; }
.proj { display:flex; align-items:center; gap:6px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg); font-weight:600; cursor:default; }
.proj svg { color:var(--fg-muted); }
.sess { margin-left:26px; padding:0 0 1px 6px; border-left:1px solid var(--border-subtle); }
.sess__item { display:flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-2); }
.sess__item--sel { background:var(--bg-selected); color:var(--fg); }
.dot { width:7px; height:7px; border-radius:50%; background:var(--fg-muted); flex-shrink:0; }
.dot--run { background:#2563eb; } :root[data-theme="dark"] .dot--run { background:#5b9dff; }
.sidebar__footer { flex-shrink:0; padding:8px 10px; border-top:1px solid var(--border-subtle); }
.sidebar__foot-btn { display:flex; align-items:center; gap:8px; width:100%; height:30px; padding:0 8px; border:0; border-radius:6px; background:transparent; color:var(--fg-2); cursor:pointer; }
.sidebar__foot-btn:hover { background:var(--bg-hover); }
.sidebar__foot-btn--active, .sidebar__foot-btn--active:hover { background:var(--bg-selected); }
.sidebar__foot-btn kbd { margin-left:auto; }
.appear { animation:appear 200ms var(--ease); }
@keyframes appear { from { opacity:0; transform:translateY(-3px); } }

/* ================= App: Hauptbereich ================= */
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.chat__head { display:flex; align-items:center; gap:8px; height:48px; padding:0 20px; border-bottom:1px solid var(--border-subtle); flex-shrink:0; font-weight:600; }
.chat__head span { color:var(--fg-muted); font-weight:400; }
.chat__body { flex:1; min-height:0; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:46rem; }
.msg-user { align-self:flex-end; max-width:80%; padding:8px 12px; border-radius:10px; background:var(--bg-hover); }
.msg-agent { color:var(--fg-2); }
.chat__input { margin:0 20px 16px; height:64px; border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--fg-muted); }
.settings { flex:1; min-height:0; display:flex; flex-direction:column; }
.settings__head { display:flex; align-items:center; height:48px; padding:0 20px; border-bottom:1px solid var(--border-subtle); flex-shrink:0; }
.settings__title { margin:0; font-size:13.5px; font-weight:600; }
.settings__split { flex:1; min-height:0; display:grid; grid-template-columns:200px minmax(0,1fr); }
.settings__nav { padding:12px 10px; border-right:1px solid var(--border-subtle); display:flex; flex-direction:column; gap:2px; }
.settings__cat { padding:6px 10px; border-left:2px solid transparent; color:var(--fg-2); }
.settings__cat small { display:block; color:var(--fg-muted); font-size:11px; }
.settings__cat--sel { background:var(--bg-selected); border-left-color:var(--accent); color:var(--fg); }
.settings__body { overflow:auto; padding:16px 24px; }
.settings__section { margin:22px 0 6px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-muted); }
.ok { color:#16803c; } :root[data-theme="dark"] .ok { color:#4cc38a; }
.settings__section:first-child { margin-top:0; }
.srow { display:grid; grid-template-columns:230px minmax(0,1fr); align-items:center; gap:16px; padding:8px 0; border-top:1px solid var(--border-subtle); }
.srow__label { display:flex; align-items:center; gap:6px; }
.srow__info { display:flex; width:18px; height:18px; align-items:center; justify-content:center; padding:0; border:0; background:transparent; color:var(--fg-muted); cursor:help; }
.srow__ctl { display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap; }
.srow__mono { font:12px var(--font-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.srow__muted { color:var(--fg-muted); }
.sbtn { flex-shrink:0; height:30px; padding:0 12px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--fg-2); cursor:pointer; }
.sbtn:hover { background:var(--bg-hover); }
.switch { position:relative; flex-shrink:0; width:34px; height:20px; padding:0; border:0; border-radius:999px; background:var(--toggle-off); cursor:pointer; transition:background 160ms var(--ease); }
.switch--on { background:var(--toggle-on); }
.switch__knob { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:999px; background:var(--on-toggle); transition:left 160ms var(--ease); }
.switch--on .switch__knob { left:16px; }
.srow__note { color:var(--fg-muted); font-size:12px; }

@container stage (max-width:575px) {
  .sidebar { width:100%; border-right:0; }
  .sidebar[data-hidden-narrow] { display:none; }
  .main { display:none; } .main[data-show-narrow] { display:flex; }
  .sidebar__new, .sidebar__foot-btn { height:44px; }
  .settings__split { grid-template-columns:1fr; } .settings__nav { display:none; }
  .srow { grid-template-columns:1fr; gap:6px; }
}

/* ================= Dialog: gemeinsamer Rahmen (wie src/components/Dialog.css) ================= */
.scrim { position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:32px; background:var(--scrim); }
.scrim--top { align-items:flex-start; padding-top:min(12vh,88px); }
.dlg { display:flex; flex-direction:column; max-width:100%; max-height:100%; border:1px solid var(--border); border-radius:10px; background:var(--bg-popover); box-shadow:var(--shadow); color:var(--fg); overflow:hidden; }
.dlg__head { flex-shrink:0; padding:16px 20px 12px; }
.dlg__titlerow { display:flex; align-items:baseline; gap:12px; margin-bottom:10px; min-width:0; }
.dlg__title { margin:0; font-size:14px; font-weight:600; white-space:nowrap; }
.dlg__status { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--fg-muted); }
.dlg__status--warn { color:var(--fg); }
.dlg__status--warn::before { content:"⚠ "; color:var(--error); }
.dlg__close { display:none; flex-shrink:0; width:44px; height:44px; margin:-14px -14px -14px auto; border:0; border-radius:6px; background:transparent; color:var(--fg-2); cursor:pointer; }
.search { position:relative; display:flex; align-items:center; gap:8px; }
.search__field { position:relative; flex:1; min-width:0; }
.search__icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--fg-muted); pointer-events:none; }
.search__input { width:100%; height:32px; padding:0 30px 0 32px; border:1px solid var(--border); border-radius:6px; background:var(--bg-base); color:var(--fg); }
.search__input::-webkit-search-cancel-button { display:none; }
.search__input::placeholder { color:var(--fg-muted); }
.search__input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.search__clear { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:24px; height:24px; padding:0; border:0; border-radius:4px; background:transparent; color:var(--fg-muted); cursor:pointer; }
.search__clear:hover { background:var(--bg-hover); color:var(--fg); }
.search__info { flex-shrink:0; display:flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; border:0; border-radius:6px; background:transparent; color:var(--fg-muted); cursor:help; }
.search__info:hover { background:var(--bg-hover); color:var(--fg); }
.search__tip { position:absolute; right:0; top:38px; z-index:3; width:min(21rem,100%); padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-popover); box-shadow:var(--shadow); color:var(--fg-2); font-size:12px; }
.dlg__error { flex-shrink:0; margin:0 20px 8px; padding:6px 10px; border-left:3px solid var(--error); background:var(--error-subtle); font-size:12px; }
.dlg__error b { color:var(--fg); }
.dlg__group { margin:6px 8px 4px; font-size:11px; font-weight:600; color:var(--fg-muted); }
.dlg__empty { margin:0; padding:32px 16px; text-align:center; color:var(--fg-muted); }
.dlg__empty strong { display:block; margin-bottom:2px; color:var(--fg-2); font-weight:600; }
.dlg__foot { flex-shrink:0; display:flex; align-items:center; gap:12px; min-height:34px; padding:6px 20px; border-top:1px solid var(--border-subtle); font-size:12px; color:var(--fg-muted); }
.dlg__done { color:var(--fg-2); }
.dlg__done::before { content:"✓ "; color:var(--accent-text); }
.keys { margin-left:auto; white-space:nowrap; }
.skel { height:42px; margin:6px 8px; border-radius:6px; background:var(--bg-hover); }
.kind { flex-shrink:0; padding:0 5px; border:1px solid var(--border); border-radius:4px; font-size:11px; line-height:16px; color:var(--fg-2); }
.path { font:11.5px var(--font-mono); color:var(--fg-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; min-width:0; }
.path bdi { unicode-bidi:plaintext; }
.snip { font-size:12px; color:var(--fg-2); display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
mark { padding:0 1px; border-radius:3px; background:var(--accent-subtle); color:inherit; font-weight:600; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:28px; padding:0 10px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; white-space:nowrap; }
.btn:hover { background:var(--bg-hover); }
.btn:active { transform:translateY(1px); }
.btn--primary { border-color:var(--accent-strong); background:var(--accent-strong); color:var(--on-accent); }
.btn--primary:hover { background:var(--accent-strong); filter:brightness(1.08); }
.list { margin:0; padding:0; list-style:none; }
.dlg__scroll { flex:1; min-height:0; overflow-y:auto; }

/* ---------- Vorschlag A: Liste (Archiv-Muster, verfeinert) ---------- */
.va { width:40rem; height:min(34rem,100%); }
.va .dlg__scroll { padding:0 12px 8px; }
.ha { position:relative; padding:8px 10px 8px 12px; border-left:2px solid transparent; border-radius:0 6px 6px 0; cursor:pointer; }
.ha + .ha { margin-top:2px; }
.ha:hover { background:var(--bg-hover); }
.ha--sel, .ha--sel:hover { background:var(--bg-selected); border-left-color:var(--accent); }
.ha__l1 { display:flex; align-items:center; gap:8px; min-width:0; height:24px; }
.ha__title { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ha__acts { display:flex; gap:6px; margin-left:auto; flex-shrink:0; visibility:hidden; }
.ha--sel .ha__acts { visibility:visible; }
.ha__desc { margin:1px 0 0; color:var(--fg-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ha .path { margin:1px 0 0; }
.ha .snip { margin:3px 0 0; }
.ha--sel .path { color:var(--fg-2); }

/* ---------- Vorschlag B: Befehlspalette ---------- */
.vb { width:38rem; height:min(30rem,100%); }
.vb .dlg__head { padding:12px 14px 10px; border-bottom:1px solid var(--border-subtle); }
.vb .dlg__titlerow { margin-bottom:8px; }
.vb .search__input { height:36px; font-size:14px; }
.vb .dlg__scroll { padding:6px; }
.hb { display:flex; align-items:center; gap:10px; height:34px; padding:0 10px; border-radius:6px; cursor:pointer; color:var(--fg-2); }
.hb:hover { background:var(--bg-hover); }
.hb--sel, .hb--sel:hover { background:var(--bg-selected); color:var(--fg); box-shadow:inset 2px 0 0 var(--accent); border-radius:0 6px 6px 0; }
.hb__title { flex-shrink:1; min-width:4rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); font-weight:600; }
.hb .path { flex:1 1 0; margin-left:4px; }
.hb .kind { margin-left:auto; }
.pb { flex-shrink:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; align-items:start; padding:10px 14px; border-top:1px solid var(--border-subtle); background:var(--bg-base); min-height:84px; }
.pb__desc { margin:0; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pb .snip { margin:0; grid-column:1; }
.pb__acts { grid-column:2; grid-row:1 / span 2; display:flex; flex-direction:column; gap:6px; }

/* ---------- Vorschlag C: Liste mit Vorschau ---------- */
.vc { width:62rem; height:min(36rem,100%); }
.vc__split { flex:1; min-height:0; display:grid; grid-template-columns:minmax(16rem,23rem) minmax(0,1fr); border-top:1px solid var(--border-subtle); }
.vc__list { overflow-y:auto; padding:6px; border-right:1px solid var(--border-subtle); }
.hc { display:grid; grid-template-columns:16px minmax(0,1fr); column-gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
.hc + .hc { margin-top:1px; }
.hc svg { margin-top:2px; color:var(--fg-muted); }
.hc:hover { background:var(--bg-hover); }
.hc--sel, .hc--sel:hover { background:var(--bg-selected); box-shadow:inset 2px 0 0 var(--accent); border-radius:0 6px 6px 0; }
.hc--sel svg, .hc--sel .path { color:var(--fg-2); }
.hc__title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hc .path { grid-column:2; }
.pv { display:flex; flex-direction:column; min-height:0; }
.pv__back { display:none; align-items:center; gap:6px; height:44px; padding:0 14px; border:0; border-bottom:1px solid var(--border-subtle); background:transparent; color:var(--fg-2); cursor:pointer; text-align:left; }
.pv__head { padding:14px 18px 10px; border-bottom:1px solid var(--border-subtle); }
.pv__title { margin:0 0 4px; font-size:14px; font-weight:600; overflow-wrap:anywhere; }
.pv__meta { display:flex; align-items:center; gap:8px; min-width:0; }
.pv__acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.pv__body { flex:1; min-height:0; overflow:auto; padding:12px 18px 16px; }
.pv__desc { margin:0 0 12px; color:var(--fg); }
.pv__label { margin:0 0 4px; font-size:11px; font-weight:600; color:var(--fg-muted); }
.pv__where { margin:0 0 6px; font-size:12px; color:var(--fg-2); }
.pv__snip { margin:0; padding:10px 12px; border-left:2px solid var(--border); background:var(--bg-base); font-size:12.5px; color:var(--fg-2); white-space:pre-wrap; overflow-wrap:anywhere; }
.pv__img { display:block; width:100%; max-width:22rem; border:1px solid var(--border-subtle); border-radius:6px; }
.pv__imgnote { margin:4px 0 0; font-size:11px; color:var(--fg-muted); }
.pv__none { margin:auto; color:var(--fg-muted); }

/* ---------- Breiten ---------- */
@container stage (max-width:1023px) { .vc { width:100%; } }
@container stage (max-width:767px) {
  .vc__split { grid-template-columns:1fr; }
  .vc__list { border-right:0; }
  .vc .pv { display:none; }
  .vc[data-detail] .vc__list { display:none; }
  .vc[data-detail] .pv { display:flex; }
  .vc .pv__back { display:flex; }
}
@container stage (max-width:575px) {
  .scrim, .scrim--top { padding:0; align-items:flex-end; }
  .dlg { width:100%; height:90%; border-radius:12px 12px 0 0; border-bottom:0; }
  .dlg__close { display:block; }
  .dlg__titlerow { flex-wrap:wrap; align-items:center; gap:0 12px; }
  .dlg__status { order:3; flex-basis:100%; white-space:normal; }
  .search__input { height:44px; }

          <div class="srow"><div class="srow__label">Abgleich ${info('Vergleicht Master-Ordner und ~\\.claude.')}</div><div class="srow__ctl"><span class="ok">Gleich</span><button class="sbtn" type="button">Erneut prüfen</button></div></div>
          <p class="settings__section">Developer Vault</p>
          <div class="srow"><div class="srow__label">Vault-Ordner ${info('Ordner deiner Entwicklerbibliothek.')}</div><div class="srow__ctl">${dirCtl}</div></div>
          ${enabledRow}${statusRow}`}
        </div>
      </div></div>`;
    if (narrow()) { const b = $('back'); b.style.display = ''; b.style.marginRight = '10px'; }
    $('back').addEventListener('click', () => { S.view = 'chat'; renderAll(); });
    $('vswitch')?.addEventListener('click', () => { S.vaultOn = !S.vaultOn; S.justOn = S.vaultOn; renderAll(); });
    $('vpick')?.addEventListener('click', () => { if (S.vaultDir === null){ S.vaultDir = 'D:\\Vault'; S.vaultOn = false; renderAll(); } });
    $('vremove')?.addEventListener('click', () => { S.vaultDir = null; renderAll(); });
    return;
  }
  m.removeAttribute('data-show-narrow'); $('sidebar').removeAttribute('data-hidden-narrow');
  m.innerHTML = `<div class="chat__head">Vault-Suche entwerfen <span>· Agenten-Verwalter</span></div>
    <div class="chat__body"><div class="msg-user">Wo lag nochmal das Snippet für den Ladebalken?</div><div class="msg-agent">Im Vault unter snippets/ui/ladebalken/progress.tsx — Komponente mit Restzeit.</div></div>
    <div class="chat__input">Nachricht an den Agenten …</div>`;
}

/* ---------------- Dialog ---------------- */
function openDialog(){
  if (!isOn()) return;
  S.open = true; S.openErr = ''; S.done = ''; S.detail = false; S.tip = false;
  S.loading = S.state === 'loading';
  run(S.q, true);
  const inp = $('q'); inp.focus(); inp.select();   // letzte Suche bleibt, Tippen ersetzt sie
  if (S.loading) setTimeout(() => { S.loading = false; if (S.open) run(S.q); }, 1600);
}
function closeDialog(){ S.open = false; $('scrim').hidden = true; $('scrim').innerHTML = ''; $('vaultbtn')?.focus(); }
function run(query, keepSel){ const r = search(query); S.hits = r.hits; S.total = r.total; S.shownQ = query; if (!keepSel) S.sel = 0; S.sel = Math.min(S.sel, Math.max(0, S.hits.length - 1)); renderDialog(); }

function headHTML(){
  const warn = S.state === 'missing';
  return `<header class="dlg__head">
    <div class="dlg__titlerow"><h3 class="dlg__title" id="vs-title">Developer Vault</h3><span class="dlg__status${warn ? ' dlg__status--warn' : ''}">${esc(statusText())}</span><button class="dlg__close" type="button" id="close" aria-label="Schließen">✕</button></div>
    <div class="search">
      <div class="search__field">${'<span class="search__icon">' + I_SEARCH + '</span>'}
        <input class="search__input" id="q" type="search" role="combobox" aria-expanded="true" aria-controls="hits" aria-autocomplete="list" aria-label="Vault durchsuchen" placeholder="Titel, Tag, Dateiname oder Text" autocomplete="off" value="${esc(S.q)}">
        <button class="search__clear" type="button" id="clear" aria-label="Suche leeren" ${S.q ? '' : 'hidden'}>✕</button>
      </div>
      <button class="search__info" type="button" id="info" aria-label="Suchhilfe" aria-expanded="${S.tip}" aria-controls="tip">${I_INFO}</button>
      <div class="search__tip" id="tip" role="note" ${S.tip ? '' : 'hidden'}>${SEARCH_INFO}</div>
    </div></header>`;
}
function errorHTML(){
  let e = S.openErr;
  if (S.state === 'searcherr') e = 'Die Suche ist fehlgeschlagen: Die Index-Datei ist nicht lesbar. In den Einstellungen „Neu einlesen“ wählen.';
  if (S.state === 'missing') e = 'Der Vault-Ordner D:\\Vault ist nicht erreichbar. Laufwerk verbinden oder in den Einstellungen einen anderen Ordner wählen.';
  return e ? `<p class="dlg__error" role="alert"><b>Fehler:</b> ${esc(e)}</p>` : '';
}
function emptyHTML(){
  if (S.loading) return '<div class="skel"></div><div class="skel"></div><div class="skel"></div><p class="dlg__empty" role="status">Lädt …</p>';
  if (S.state === 'searcherr' || S.state === 'missing') return '';
  if (!S.hits.length) return terms(S.shownQ).length
    ? '<p class="dlg__empty"><strong>Nichts gefunden.</strong>Weniger oder kürzere Wörter versuchen — Wortanfänge genügen.</p>'
    : '<p class="dlg__empty"><strong>Der Vault ist noch leer.</strong>Dateien in den Vault-Ordner legen; in den Einstellungen „Grundgerüst anlegen“.</p>';
  return null;
}
function footHTML(){
  const count = S.hits.length || S.total ? `${S.hits.length} von ${S.total} Treffern` : '';
  const scan = S.state === 'scanning' ? ' · Index wird noch aufgebaut' : '';
  const done = S.done ? ` <span class="dlg__done">${esc(S.done)}</span>` : '';
  const keys = `<span class="keys"><kbd>↑</kbd> <kbd>↓</kbd> wählen · <kbd>Enter</kbd> öffnen · <kbd>Ctrl Enter</kbd> im Ordner · <kbd>Esc</kbd> schließen</span>`;
  return `<footer class="dlg__foot"><span aria-live="polite">${count}${scan}${done}</span>${keys}</footer>`;
}
const recentLabel = () => terms(S.shownQ).length ? '' : '<p class="dlg__group">Zuletzt geändert</p>';
const actBtns = (cls='') => `<button class="btn btn--primary ${cls}" type="button" data-act="open">${I_OPEN}Öffnen</button><button class="btn ${cls}" type="button" data-act="reveal">${I_FOLDER}Im Ordner zeigen</button>`;
const opt = (i, cls, inner) => `<li class="${cls}${i === S.sel ? ' ' + cls + '--sel' : ''}" role="option" id="hit-${i}" data-i="${i}" aria-selected="${i === S.sel}">${inner}</li>`;

function bodyA(){
  const ts = terms(S.shownQ), e = emptyHTML();
  const rows = e ?? recentLabel() + `<ul class="list" id="hits" role="listbox" aria-label="Treffer">${S.hits.map((d, i) => opt(i, 'ha', `
    <div class="ha__l1"><span class="ha__title" title="${esc(d.title)}">${esc(d.title)}</span><span class="kind">${KIND_LABEL[d.kind]}</span><span class="ha__acts">${actBtns()}</span></div>
    <p class="path" title="${esc(d.path)}"><bdi>${esc(d.path)}</bdi></p>
    ${d.desc ? `<p class="ha__desc">${esc(d.desc)}</p>` : ''}
    ${d.text ? `<p class="snip">${snippet(d, ts)}</p>` : ''}
    <div class="ha__acts--narrow">${actBtns()}</div>`)).join('')}</ul>`;
  return `<div class="dlg va" role="dialog" aria-modal="true" aria-labelledby="vs-title" id="dlg">${headHTML()}${errorHTML()}<div class="dlg__scroll" id="scroll">${rows}</div>${footHTML()}</div>`;
}
function bodyB(){
  const ts = terms(S.shownQ), e = emptyHTML(), d = S.hits[S.sel];
  const rows = e ?? recentLabel() + `<ul class="list" id="hits" role="listbox" aria-label="Treffer">${S.hits.map((h, i) => opt(i, 'hb', `${svg(ICON[h.kind])}<span class="hb__title" title="${esc(h.title)}">${esc(h.title)}</span><span class="path"><bdi>${esc(h.path)}</bdi></span><span class="kind">${KIND_LABEL[h.kind]}</span>`)).join('')}</ul>`;
  const detail = !e && d ? `<div class="pb" aria-live="polite">
      <p class="pb__desc">${esc(d.desc || fileName(d.path))}</p>
      <p class="snip">${d.text ? snippet(d, ts, 200) : '<span class="path"><bdi>' + esc(d.path) + '</bdi></span>'}</p>
      <div class="pb__acts">${actBtns()}</div></div>` : '';
  return `<div class="dlg vb" role="dialog" aria-modal="true" aria-labelledby="vs-title" id="dlg">${headHTML()}${errorHTML()}<div class="dlg__scroll" id="scroll">${rows}</div>${detail}${footHTML()}</div>`;
}
function previewImg(){
  return `<svg class="pv__img" viewBox="0 0 320 180" role="img" aria-label="Beispielbild"><rect width="320" height="180" fill="#e4e6f1"/><circle cx="90" cy="100" r="34" fill="#c4572f" opacity=".75"/><circle cx="170" cy="96" r="28" fill="#3d6fa8" opacity=".7"/><circle cx="240" cy="104" r="30" fill="#16803c" opacity=".6"/><text x="160" y="166" font-size="12" text-anchor="middle" fill="#555" font-family="Segoe UI, sans-serif">Beispielbild (Platzhalter)</text></svg>`;
}
function bodyC(){
  const ts = terms(S.shownQ), e = emptyHTML(), d = S.hits[S.sel];
  const list = e ?? recentLabel() + `<ul class="list" id="hits" role="listbox" aria-label="Treffer">${S.hits.map((h, i) => opt(i, 'hc', `${svg(ICON[h.kind])}<span class="hc__title" title="${esc(h.title)}">${esc(h.title)}</span><span class="path"><bdi>${esc(h.path)}</bdi></span>`)).join('')}</ul>`;
  let pv = '<p class="pv__none">Kein Treffer gewählt.</p>';
  if (!e && d) {
    const where = d.heading ? `Abschnitt „${esc(d.heading)}“ · Zeile ${d.line}` : (d.text ? `Zeile ${d.line}` : '');
    const body = d.kind === 'image' && d.preview ? previewImg() + '<p class="pv__imgnote">Vorschau aus dem Feld preview</p>'
      : d.text ? `<p class="pv__label">Fundstelle</p>${where ? `<p class="pv__where">${where}</p>` : ''}<p class="pv__snip">${snippet(d, ts, 320)}</p>`
      : '<p class="srow__muted">Kein Textinhalt — nur Titel und Dateiname sind durchsuchbar.</p>';
    pv = `<button class="pv__back" type="button" id="pvback">← Treffer</button>
      <div class="pv__head"><h4 class="pv__title">${esc(d.title)}</h4>
        <div class="pv__meta"><span class="kind">${KIND_LABEL[d.kind]}</span><span class="path" title="${esc(d.path)}"><bdi>${esc(d.path)}</bdi></span></div>
        <div class="pv__acts">${actBtns()}</div></div>
      <div class="pv__body">${d.desc ? `<p class="pv__desc">${esc(d.desc)}</p>` : ''}${body}</div>`;
  }
  return `<div class="dlg vc" role="dialog" aria-modal="true" aria-labelledby="vs-title" id="dlg" ${S.detail ? 'data-detail' : ''}>${headHTML()}${errorHTML()}
    <div class="vc__split"><div class="vc__list" id="scroll">${list}</div><section class="pv" aria-label="Vorschau">${pv}</section></div>${footHTML()}</div>`;
}

function renderDialog(){
  if (!S.open) return;
  const sc = $('scrim'), hadFocus = document.activeElement?.id === 'q', caret = $('q')?.selectionStart;
  const oldScroll = $('scroll')?.scrollTop ?? 0;
  sc.hidden = false;
  sc.className = 'scrim' + (S.variant === 'b' ? ' scrim--top' : '');
  sc.innerHTML = S.variant === 'a' ? bodyA() : S.variant === 'b' ? bodyB() : bodyC();
  const inp = $('q');
  if (hadFocus || !narrow() || !S.detail) { inp.focus(); if (caret != null) inp.setSelectionRange(caret, caret); }
  if (S.hits.length) inp.setAttribute('aria-activedescendant', 'hit-' + S.sel);
  const s = $('scroll'); if (s) s.scrollTop = oldScroll;
  $('hit-' + S.sel)?.scrollIntoView({block:'nearest'});
  bindDialog(); renderTools();
}
function bindDialog(){
  const inp = $('q'); let timer;
  inp.addEventListener('input', () => {
    S.q = inp.value; S.openErr = ''; S.done = ''; S.detail = false; $('clear').hidden = !S.q; clearTimeout(timer);
    if (!terms(S.q).length) { run(S.q); return; }      // leeres Feld ohne Verzögerung
    timer = setTimeout(() => run(S.q), 250);           // sonst entprellt
    renderTools();
  });
  $('clear').addEventListener('click', () => { S.q = ''; run(''); $('q').focus(); });
  $('info').addEventListener('click', () => { S.tip = !S.tip; $('tip').hidden = !S.tip; $('info').setAttribute('aria-expanded', String(S.tip)); });
  $('close').addEventListener('click', closeDialog);
  $('pvback')?.addEventListener('click', () => { S.detail = false; renderDialog(); });
  $('dlg').addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); if (S.tip) { S.tip = false; $('tip').hidden = true; } else closeDialog(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); move(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Enter' && e.target.id === 'q') { e.preventDefault(); act(S.sel, e.ctrlKey); }
  });
  $('dlg').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b) { const li = b.closest('[data-i]'); act(li ? +li.dataset.i : S.sel, b.dataset.act === 'reveal'); return; }
    const li = e.target.closest('[data-i]'); if (!li) return;
    const i = +li.dataset.i;
    if (S.variant === 'c') { S.sel = i; S.detail = stageW() < 768; renderDialog(); return; }       // C: Klick wählt, Vorschau zeigt
    if (narrow()) { S.sel = i; renderDialog(); return; }                                          // Handy: Tippen wählt
    if (S.sel === i || S.variant === 'b') act(i, false); else { S.sel = i; renderDialog(); }      // A: erster Klick wählt, zweiter öffnet
  });
  $('dlg').addEventListener('dblclick', e => { const li = e.target.closest('[data-i]'); if (li && S.variant === 'c') act(+li.dataset.i, false); });
  $('scrim').onmousedown = e => { if (e.target === $('scrim')) closeDialog(); };
}
function move(n){ if (!S.hits.length) return; S.sel = (S.sel + n + S.hits.length) % S.hits.length; S.done = ''; renderDialog(); }
function act(i, reveal){
  const d = S.hits[i]; if (!d) return; S.sel = i;
  if (d.broken) { S.openErr = `„${fileName(d.path)}“ ließ sich nicht öffnen: Die Datei existiert nicht mehr. In den Einstellungen „Neu einlesen“ wählen.`; S.done = ''; renderDialog(); return; }
  S.openErr = ''; S.done = (reveal ? 'Im Ordner gezeigt: ' : 'Geöffnet: ') + fileName(d.path);
  if (S.variant === 'b' && !reveal) { closeDialog(); flash(S.done); return; }   // Palette: schließt nach dem Öffnen
  renderDialog();
}
function flash(text){ const t = document.createElement('div'); t.textContent = '✓ ' + text; t.setAttribute('role','status'); Object.assign(t.style, {position:'absolute', left:'50%', bottom:'16px', transform:'translateX(-50%)', padding:'6px 12px', border:'1px solid var(--border)', borderRadius:'8px', background:'var(--bg-popover)', boxShadow:'var(--shadow)', fontSize:'12px', zIndex:50}); stage.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------------- Entwurfsleiste ---------------- */
const CMP = {
  a:{name:'A · Liste', plus:['Nah am Archiv-Dialog, sofort vertraut','Alles zu einem Treffer in der Liste sichtbar'], minus:['Hohe Zeilen: etwa fünf Treffer auf einen Blick','Erster Klick wählt, zweiter öffnet']},
  b:{name:'B · Palette', plus:['Schnellster Weg per Tastatur, zehn Treffer und mehr auf einen Blick','Schließt nach dem Öffnen — wie Ctrl P'], minus:['Ausschnitt nur für den gewählten Treffer (Leiste unten)','Weniger zum Stöbern']},
  c:{name:'C · Vorschau', plus:['Lesen ohne Öffnen: Fundstelle, Abschnitt, Zeile, Bild','Knöpfe stehen fest in der Vorschau, die Liste springt nie'], minus:['Breit (62 rem); unter 768 px zweistufig: Liste, dann Vorschau','Ausschnitt in der Liste fehlt, er steht rechts']},
};
function renderCmp(){
  $('cmp').innerHTML = Object.entries(CMP).map(([k, v]) => `<h4>${v.name}${k === S.variant ? ' (angezeigt)' : ''}${k === 'c' ? ' · Empfehlung' : ''}</h4><ul>${v.plus.map(p => '<li>+ ' + p + '</li>').join('')}${v.minus.map(p => '<li>− ' + p + '</li>').join('')}</ul>`).join('')
    + '<h4>Einstieg</h4><ul><li>Fußleiste: über „Archiv“, gleiche Bauart</li><li>Oben: unter „Neues Vorhaben“, als Suchzeile — häufiger Weg, sichtbarer</li><li>Beide nur bei Vault-Ordner und Schalter „Developer Vault“ an</li></ul>';
}
const DSEL = {
  state:{label:'Zustand', opts:[['ready','Bereit'],['many','Viele Treffer'],['scanning','Wird eingelesen'],['empty','Vault leer'],['loading','Erste Suche lädt'],['searcherr','Suche fehlgeschlagen'],['missing','Ordner fehlt']]},
  width:{label:'Breite', opts:[['100%','Voll'],['390px','390 Handy'],['860px','860 Tablet'],['1366px','1366 Laptop']]},
  theme:{label:'Thema', opts:[['auto','System'],['light','Hell'],['dark','Dunkel']]},
};
function renderDsel(){
  document.querySelectorAll('.dsel').forEach(el => {
    const k = el.dataset.key, c = DSEL[k], cur = c.opts.find(o => o[0] === S[k]);
    el.innerHTML = `<button type="button" class="dsel__btn" aria-haspopup="listbox" aria-expanded="false">${c.label}: ${cur[1]}</button><ul class="dsel__menu" role="listbox" hidden>${c.opts.map(o => `<li role="option" data-val="${o[0]}" aria-selected="${o[0] === S[k]}">${o[1]}</li>`).join('')}</ul>`;
    const btn = el.querySelector('button'), menu = el.querySelector('ul');
    btn.onclick = () => { const o = menu.hidden; document.querySelectorAll('.dsel__menu').forEach(m => m.hidden = true); menu.hidden = !o; btn.setAttribute('aria-expanded', String(o)); };
    menu.onclick = e => { const li = e.target.closest('li'); if (!li) return; set(k, li.dataset.val); };
  });
}
document.addEventListener('click', e => { if (!e.target.closest('.dsel')) document.querySelectorAll('.dsel__menu').forEach(m => m.hidden = true); });
function set(k, v){
  S[k] = v;
  if (k === 'width') stage.style.width = v;
  if (k === 'theme') { if (v === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = v; }
  if (k === 'state') { S.openErr = ''; S.done = ''; if (S.open) { S.loading = v === 'loading'; run(S.q); if (S.loading) setTimeout(() => { S.loading = false; if (S.open) run(S.q); }, 1600); } }
  renderAll();
}
function renderTools(){
  $('tools').hidden = !S.tools;
  if (S.tools) $('tools').innerHTML = `<b>Gleiche Suche für Agenten:</b> vault_search { "query": ${esc(JSON.stringify(S.q.trim()))}, "limit": 8 } · <b>Inhalt lesen:</b> vault_get { "path": "${esc(S.hits[S.sel]?.path ?? '…')}" } · <b>Öffnen und Im Ordner zeigen</b> nur im Dialog, durch den Klick des Nutzers.`;
}
function tier(){ const w = Math.round(stageW()); const t = w < 576 ? 'xs (Handy)' : w < 768 ? 'sm' : w < 992 ? 'md (Tablet)' : w < 1200 ? 'lg' : w < 1408 ? 'xl (Laptop)' : 'xxl'; $('tier').textContent = `${w} px · ${t}`; }
function renderAll(){
  document.querySelectorAll('#variant button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.variant)));
  document.querySelectorAll('#entry button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.e === S.entry)));
  document.querySelectorAll('#smode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === S.settingsMode)));
  $('toolsbtn').setAttribute('aria-pressed', String(S.tools));
  renderDsel(); renderCmp(); renderSidebar(); renderMain(); tier();
  if (S.open) { if (isOn()) renderDialog(); else closeDialog(); }
  renderTools();
}
$('variant').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.variant = b.dataset.v; S.detail = false; renderAll(); } });
$('entry').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.entry = b.dataset.e; renderAll(); } });
$('smode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.settingsMode = b.dataset.s; S.view = 'settings'; renderAll(); } });
$('toolsbtn').addEventListener('click', () => { S.tools = !S.tools; renderAll(); });
$('cmpbtn').addEventListener('click', () => { const p = $('cmp'); p.hidden = !p.hidden; $('cmpbtn').setAttribute('aria-expanded', String(!p.hidden)); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!S.open) openDialog(); else $('q').select(); }   // ohne Vault: nichts
});
window.addEventListener('resize', () => { tier(); if (S.open) renderDialog(); });

/* Adresse: #v=a|b|c&entry=top&state=…&w=390&dark&off&nodir&settings&open&q=lade&sel=2&detail&act=err */
const h = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(p => { const [k, v] = p.split('='); return [k, v === undefined ? true : decodeURIComponent(v)]; }));
if (h.v) S.variant = h.v;
if (h.entry) S.entry = h.entry;
if (h.state) S.state = h.state;
if (h.w) { S.width = h.w + 'px'; stage.style.width = S.width; }
if (h.dark) { S.theme = 'dark'; root.dataset.theme = 'dark'; }
if (h.light) { S.theme = 'light'; root.dataset.theme = 'light'; }
if (h.off) S.vaultOn = false;
if (h.nodir) S.vaultDir = null;
if (h.settings) S.view = 'settings';
if (h.lib) S.settingsMode = 'lib';
if (h.q) S.q = h.q;
renderAll();
if (h.open) { openDialog(); if (h.sel) { S.sel = +h.sel; } if (h.detail) S.detail = true; if (h.act === 'err') { S.sel = S.hits.findIndex(d => d.broken); act(S.sel, false); } else renderDialog(); }
if (h.cmp) $('cmpbtn').click();
</script>
