<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Bibliothek bearbeiten</title>
<style>
:root {
  --bg: #ffffff; --bg-side: #f8f8f8; --bg-surface: #ffffff; --bg-hover: #f0f0f0; --bg-selected: #e4e6f1;
  --border-subtle: #e5e5e5; --border: #cecece;
  --fg: #3c3c3c; --fg-2: #555555; --muted: #6e6e6e;
  --accent: #c4572f; --accent-text: #a8461f; --on-accent: #ffffff;
  --running: #2563eb; --waiting: #8a5700; --error: #c5352e; --done: #16803c;
  --del-bg: #fdeceb; --wait-bg: #fbf3e2; --hunk-bg: #f3f3f6;
  --g-rules: #3d6fa8; --g-skills: #7c3aed; --g-know: #16803c;
  --c-key: #0000ff; --c-str: #a31515; --c-com: #008000; --c-num: #098658; --c-fn: #795e26; --c-type: #267f99; --c-var: #001080;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.14); --scrim: rgb(0 0 0 / 0.28);
  --sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1f1f; --bg-side: #181818; --bg-surface: #252526; --bg-hover: #2e2e30; --bg-selected: #37373d;
  --border-subtle: #2b2b2b; --border: #3c3c3c;
  --fg: #d4d4d4; --fg-2: #b0b0b0; --muted: #8f8f8f;
  --accent: #e0825c; --accent-text: #eea283; --on-accent: #1d130e;
  --running: #5b9dff; --waiting: #f2b33d; --error: #f47067; --done: #4cc38a;
  --del-bg: #362827; --wait-bg: #33291a; --hunk-bg: #242428;
  --g-rules: #8ab8ea; --g-skills: #a78bfa; --g-know: #4cc38a;
  --c-key: #569cd6; --c-str: #ce9178; --c-com: #6a9955; --c-num: #b5cea8; --c-fn: #dcdcaa; --c-type: #4ec9b0; --c-var: #9cdcfe;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.45); --scrim: rgb(0 0 0 / 0.55);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1f1f1f; --bg-side: #181818; --bg-surface: #252526; --bg-hover: #2e2e30; --bg-selected: #37373d;
  --border-subtle: #2b2b2b; --border: #3c3c3c;
  --fg: #d4d4d4; --fg-2: #b0b0b0; --muted: #8f8f8f;
  --accent: #e0825c; --accent-text: #eea283; --on-accent: #1d130e;
  --running: #5b9dff; --waiting: #f2b33d; --error: #f47067; --done: #4cc38a;
  --del-bg: #362827; --wait-bg: #33291a; --hunk-bg: #242428;
  --g-rules: #8ab8ea; --g-skills: #a78bfa; --g-know: #4cc38a;
  --c-key: #569cd6; --c-str: #ce9178; --c-com: #6a9955; --c-num: #b5cea8; --c-fn: #dcdcaa; --c-type: #4ec9b0; --c-var: #9cdcfe;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.45); --scrim: rgb(0 0 0 / 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--running); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }

/* Entwurfsleiste */
.ebar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 12px; background: var(--bg-side); border-bottom: 1px solid var(--border); font-size: 12px; }
.ebar__t { font-weight: 600; }
.ebar__g { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ebar__g > span:first-child { color: var(--muted); }
.ebar .seg { flex-wrap: wrap; flex-shrink: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.seg button { background: var(--bg-surface); border: 0; border-right: 1px solid var(--border); padding: 3px 10px; min-height: 26px; font-size: 12.5px; color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--bg-hover); }
.seg button[aria-pressed="true"] { background: var(--bg-selected); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.btn { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; min-height: 28px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { color: var(--muted); cursor: not-allowed; border-style: dashed; }
.btn[disabled]:hover { border-color: var(--border); }
.btn[disabled]:active { transform: none; }
.btn--quiet { border-color: transparent; background: none; color: var(--fg-2); }
.btn--quiet:hover { background: var(--bg-hover); border-color: transparent; }
.btn--sm { min-height: 24px; padding: 1px 8px; font-size: 12px; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn--primary[disabled] { background: var(--bg-surface); border-color: var(--border); color: var(--muted); font-weight: 400; }
.btn--danger { color: var(--error); }
.btn--danger:hover { border-color: var(--error); }
kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.btn--primary kbd { color: inherit; border-color: currentColor; opacity: 0.8; }

/* App-Rahmen mit Seitenleiste (nachgebaut aus Sidebar.tsx, Inhalt Beispiel) */
.shell { flex: 1; min-height: 0; display: flex; container: shell / inline-size; }
.sb { width: 232px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg-side); border-right: 1px solid var(--border-subtle); }
.sb__new { display: flex; align-items: center; gap: 8px; margin: 8px 10px; height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-surface); }
.sb__new span { flex: 1; text-align: left; }
.sb__list { flex: 1; overflow: auto; padding: 2px 10px; }
.sb__p { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 5px; color: var(--fg-2); font-weight: 600; }
.sb__s { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 22px; border-radius: 5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.sb__foot { border-top: 1px solid var(--border-subtle); padding: 8px 10px; }
.sb__tools { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; }
.sb__tool { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px; border: 0; border-radius: 5px; background: none; color: var(--fg-2); font-size: 11px; }
.sb__tool:hover { background: var(--bg-hover); }
.sb__tool[aria-current="page"] { background: var(--bg-selected); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.sb__badge { position: absolute; top: 3px; right: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--waiting); }

.app { flex: 1; min-width: 0; display: flex; flex-direction: column; container: app / inline-size; position: relative; }
.tb { display: flex; align-items: center; gap: 6px 12px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.tb__sum { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.state--warn { color: var(--waiting); } .state--warn::before { background: var(--waiting); }
.state--err { color: var(--error); } .state--err::before { background: var(--error); }
.tb .sp { flex: 1; }
.search { position: relative; flex: 0 1 340px; min-width: 160px; }
.search input { width: 100%; height: 28px; padding: 0 52px 0 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-surface); }
.search input::placeholder { color: var(--muted); }
.search > svg { position: absolute; left: 8px; top: 7px; color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 6px; top: 5px; pointer-events: none; }
.body { flex: 1; min-height: 0; display: flex; position: relative; }
.left { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); background: var(--bg-side); min-height: 0; }
.home { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-left: 2px solid transparent; border-bottom: 1px solid var(--border-subtle); background: none; text-align: left; font-weight: 600; min-height: 34px; }
.home:hover { background: var(--bg-hover); }
.home.is-on { background: var(--bg-selected); border-left-color: var(--accent); }
.home .cnt { margin-left: auto; }
.left__scroll { flex: 1; overflow: auto; min-height: 0; }
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; container: detail / inline-size; }
.detail__scroll { flex: 1; overflow: auto; min-height: 0; }
.only-narrow { display: none !important; }

/* Baum */
.grp { --gc: var(--g-rules); display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px; border: 0; border-top: 1px solid var(--border-subtle); position: sticky; top: 0; background: var(--bg-side); z-index: 2; text-align: left; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11.5px; color: var(--fg-2); }
.gsec:first-child .grp { border-top: 0; }
.grp:hover { background: var(--bg-hover); }
.grp svg.gi { color: var(--gc); }
.grp .cnt { margin-left: auto; }
.grp--skills { --gc: var(--g-skills); } .grp--wissen { --gc: var(--g-know); }
.gbody { border-left: 2px solid color-mix(in srgb, var(--gc) 45%, transparent); margin-left: 14px; }
.gbody--skills { --gc: var(--g-skills); } .gbody--wissen { --gc: var(--g-know); } .gbody--anweisungen { --gc: var(--g-rules); }
.chev { width: 12px; height: 12px; transition: transform 120ms; color: var(--muted); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.row { position: relative; display: flex; align-items: center; gap: 5px; width: 100%; height: 24px; padding: 0 8px 0 calc(6px + var(--d, 0) * 14px); border: 0; border-left: 2px solid transparent; background: none; white-space: nowrap; font-size: 12.5px; text-align: left; }
.row:hover { background: var(--bg-hover); }
.row.is-sel { background: var(--bg-selected); border-left-color: var(--accent); }
.row:focus-visible { outline-offset: -2px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row--file .chev { visibility: hidden; }
.row--sub { height: 26px; }
.row--sub .nm { color: var(--fg-2); font-weight: 600; font-size: 12px; }
.row--art .nm { font-weight: 600; }
.row--dir .nm { color: var(--fg-2); }
.row--new .nm::after { content: ' · neu'; color: var(--done); font-weight: 400; }
.cnt { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; line-height: 15px; }
.dirty { color: var(--waiting); font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
.dirty::before { content: '●'; font-size: 9px; }
.add { display: none; margin-left: 2px; width: 20px; height: 20px; padding: 0; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--fg-2); align-items: center; justify-content: center; }
.rowwrap { position: relative; }
.rowwrap:hover .add, .rowwrap:focus-within .add, .rowwrap.is-sel .add { display: inline-flex; }
.add:hover { border-color: var(--accent); color: var(--fg); }
.add--del:hover { border-color: var(--error); color: var(--error); }
.rowwrap:hover .row, .rowwrap:focus-within .row { padding-right: 32px; }
.hit { font-size: 11px; color: var(--muted); }
.rowwrap .add { position: absolute; right: 6px; top: 2px; }
.ico { width: 24px; text-align: center; font: 700 9px var(--mono); letter-spacing: -0.3px; flex-shrink: 0; }
.c-md { color: var(--running); } .c-web { color: var(--accent-text); } .c-code { color: var(--g-skills); } .c-data { color: var(--done); } .c-mut { color: var(--muted); } .c-err { color: var(--error); }
.note { padding: 6px 12px 8px 30px; color: var(--muted); font-size: 12px; white-space: normal; }
.skel { height: 10px; border-radius: 3px; background: var(--bg-hover); margin: 9px 12px 9px calc(12px + var(--d, 0) * 14px); }

/* Datei */
.fh { display: flex; align-items: center; gap: 6px 10px; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.fh__path { flex: 1 1 220px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; font-size: 12.5px; }
.fh__path span { color: var(--fg-2); padding: 1px 3px; }
.fh__path b { padding: 1px 3px; overflow-wrap: anywhere; }
.fh__path i { color: var(--muted); font-style: normal; }
.fh__act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; padding: 5px 12px; border-bottom: 1px solid var(--border-subtle); font-size: 12px; color: var(--fg-2); min-height: 29px; }
.meta__where { font: 11.5px var(--mono); color: var(--muted); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 0 1 auto; }
.meta__mirror { display: inline-flex; align-items: center; gap: 4px; }
.meta__mirror--off { color: var(--muted); }
.bar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); background: var(--wait-bg); font-size: 12.5px; }
.bar--err { background: var(--del-bg); }
.bar b { font-weight: 600; }
.bar .sp { flex: 1; }
.editor { flex: 1; min-height: 0; display: flex; position: relative; }
.editor .cm-editor { flex: 1; min-width: 0; height: 100%; font-size: 12.5px; background: var(--bg); color: var(--fg); }
.editor .cm-scroller { font-family: var(--mono); line-height: 1.55; font-variant-ligatures: none; }
.editor .cm-gutters { background: var(--bg); color: var(--muted); border-right: 1px solid var(--border-subtle); }
.editor .cm-activeLine, .editor .cm-activeLineGutter { background: color-mix(in srgb, var(--bg-hover) 60%, transparent); }
.editor .cm-cursor { border-left-color: var(--fg); }
.editor .cm-selectionBackground, .editor .cm-focused .cm-selectionBackground { background: var(--bg-selected) !important; }
.editor .cm-panels { background: var(--bg-side); color: var(--fg); border-color: var(--border); }
.editor .cm-textfield { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 4px; }
.editor .cm-button { background: var(--bg-surface); background-image: none; border: 1px solid var(--border); border-radius: 4px; }
.editor .cm-focused { outline: none; }
.fallback { flex: 1; display: flex; min-height: 0; }
.fallback__no { padding: 8px 6px 8px 0; width: 46px; text-align: right; color: var(--muted); font: 12.5px/1.55 var(--mono); border-right: 1px solid var(--border-subtle); overflow: hidden; user-select: none; white-space: pre; }
.fallback textarea { flex: 1; border: 0; resize: none; padding: 8px 10px; font: 12.5px/1.55 var(--mono); background: var(--bg); outline: none; white-space: pre; tab-size: 2; }
.preview { flex: 1; min-height: 0; overflow: auto; }
.md { max-width: 760px; padding: 16px 24px 40px; line-height: 1.6; }
.md h1 { font-size: 19px; margin: 0 0 10px; } .md h2 { font-size: 15px; margin: 20px 0 6px; } .md h3 { font-size: 13.5px; margin: 16px 0 4px; }
.md code { font: 12px var(--mono); background: var(--hunk-bg); padding: 1px 4px; border-radius: 4px; }
.md table { border-collapse: collapse; margin: 8px 0; } .md td, .md th { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
.md blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--fg-2); }
.web { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.web__bar { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--border-subtle); background: var(--bg-side); }
.web__bar .sp { flex: 1; }
.web iframe { flex: 1; width: 100%; border: 0; background: #fff; }
.frame__in { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; background: repeating-conic-gradient(var(--bg-hover) 0% 25%, var(--bg) 0% 50%) 50% / 16px 16px; }
.pdfpage { width: min(420px, 100%); aspect-ratio: 1 / 1.414; background: #fff; color: #222; box-shadow: 0 1px 4px rgb(0 0 0 / 0.25); padding: 28px 30px; font: 11px/1.6 var(--sans); }
.pdfpage div { height: 7px; background: #e3e3e3; border-radius: 2px; margin: 7px 0; }
.thumb { width: min(420px, 100%); aspect-ratio: 16 / 10; border: 1px solid var(--border); background: linear-gradient(135deg, var(--bg-selected), var(--bg-hover)); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }

/* Übersicht */
.page { padding: 14px 20px 40px; max-width: 980px; }
.page h2 { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-2); font-weight: 600; margin: 14px 0 6px; }
.page h2:first-child { margin-top: 0; }
.ov { display: flex; flex-direction: column; border-top: 1px solid var(--border-subtle); }
.ov__i { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 8px; border: 0; border-bottom: 1px solid var(--border-subtle); background: none; text-align: left; border-left: 2px solid transparent; }
.ov__i:hover { background: var(--bg-hover); }
.ov__t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov__d { grid-column: 2; color: var(--fg-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov__w { grid-row: 1 / span 2; grid-column: 3; color: var(--muted); font-size: 11.5px; text-align: right; white-space: nowrap; }
.ov__i .ico { grid-row: 1 / span 2; }
.empty { padding: 28px 20px; color: var(--fg-2); max-width: 560px; }
.empty b { display: block; color: var(--fg); font-size: 14px; margin-bottom: 4px; }
.empty .btn { margin-top: 10px; }

/* Suchdialog (nachgebaut, Ausschnitt) */
.sd { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px; background: var(--scrim); }
.sd__box { width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.sd__head { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }
.sd__head b { font-size: 15px; }
.sd__head input { flex: 1; height: 34px; border: 1px solid var(--accent); border-radius: 6px; padding: 0 10px; background: var(--bg); }
.sd__body { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr); min-height: 340px; }
.sd__nav { background: var(--bg-side); border-right: 1px solid var(--border-subtle); padding: 6px 0; font-size: 12.5px; }
.sd__nav div { padding: 4px 12px; color: var(--fg-2); }
.sd__nav .on { background: var(--bg-selected); border-left: 2px solid var(--accent); color: var(--fg); font-weight: 600; }
.sd__list { border-right: 1px solid var(--border-subtle); padding: 6px 0; }
.sd__hit { padding: 6px 12px; border-left: 2px solid transparent; }
.sd__hit.on { background: var(--bg-selected); border-left-color: var(--accent); }
.sd__hit b { display: block; } .sd__hit span { color: var(--fg-2); font-size: 12px; }
.sd__pv { padding: 12px 16px; }
.sd__pv p { color: var(--fg-2); margin: 6px 0 12px; }
.sd__pv .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.sd__foot { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; padding: 8px 16px; border-top: 1px solid var(--border-subtle); color: var(--muted); font-size: 12px; }
.chg { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Dialoge, Toast */
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-surface); color: var(--fg); padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--scrim); }
.dlg { padding: 16px 20px 16px; }
.dlg h1 { font-size: 15px; margin: 0 0 10px; }
.dlg h2 { font-size: 13px; margin: 14px 0 4px; }
.dlg p { margin: 6px 0; color: var(--fg-2); }
.dlg ul { margin: 2px 0; padding-left: 18px; }
.dlg li { margin: 3px 0; }
.dlg__x { float: right; }

<script>
'use strict';
/* ---------- Daten ----------
   Echt (daten.js): Pfade, Größen und Änderungszeiten aus der Bibliothek, Beschreibungen der Skills gekürzt.
   Beispiel: Namen der Gedächtnis-Dateien, alle Dateiinhalte, Seitenleiste, Uhrzeiten des Abgleichs. */
const ROOT = 'G:\\Meine Ablage\\U104_Agents';
const NOW = Date.parse('2026-11-25T14:19:00+01:00');
const GROUPS = [

const G_ICON = {

};
// Wie EDITABLE_EXTENSIONS in vault/edit.rs (Phase 1).
const EDITABLE = ['md', 'txt', 'html', 'htm', 'css', 'js', 'mjs', 'cjs', 'ts', 'tsx', 'jsx', 'json', 'yaml', 'yml', 'xml', 'svg', 'py', 'cmd', 'bat', 'ps1', 'sh', 'toml', 'csv', 'ini', 'cfg'];

function readHash() {

/* ---------- Helfer ---------- */
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chev = '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
const trash = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 3h8M4.5 3V1.8h3V3M3 3l.5 7.2h5L9 3"/></svg>';
const plus = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.5"/></svg>';
function ext(p) { const m = p.match(/\.([^./]+)$/); return m ? m[1].toLowerCase() : ''; }
function base(p) { return p.split('/').pop(); }
function size(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1).replace('.', ',') + ' KB'; return (b / 1048576).toFixed(1).replace('.', ',') + ' MB'; }
function when(ms) {
  const d = new Date(ms); const days = Math.floor((NOW - ms) / 86400000);
  if (days < 1) return 'heute ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  if (days < 2) return 'gestern';
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
function kindIcon(p) {
  const e = ext(p);

}
function isEditable(p) { return EDITABLE.includes(ext(p)); }

/* ---------- Gliederung wie im Kern (library.rs: place, apply_place) ---------- */
function placeOf(p) {
  const parts = p.split('/');
  if (parts.length === 1) return ['anweisungen', 'grundregeln'];
  const [top, second] = parts;
  if (top === 'output-styles') return ['anweisungen', 'ausgabestile'];
  if (top === 'memory') return ['anweisungen', 'gedaechtnis'];
  if (top === 'commands') return ['skills', 'befehle'];
  if (top === 'skills') return ['skills', second.startsWith('mode-') ? 'arbeitsweise' : second.startsWith('lang-') ? 'sprachen' : second.startsWith('framework-') ? 'frameworks' : 'werkzeuge'];
  if (top === '_vault') return ['wissen', parts.length > 2 ? second : ''];
  return ['wissen', ''];
}
// Artefakt: Skill-Ordner, Ordner mit manifest.yaml, sonst die Datei selbst.
function artifactOf(p) {
  const parts = p.split('/');
  if (parts[0] === 'skills' && parts.length > 2) return parts.slice(0, 2).join('/');
  for (let i = parts.length - 1; i > 0; i--) {
    const dir = parts.slice(0, i).join('/');
    if (files.has(dir + '/manifest.yaml')) return dir;
  }
  return p;
}
function artTitle(a) {
  if (a === '_vault/design/baukasten') return 'UI-Baukasten';
  if (a.startsWith('commands/')) return '/' + base(a).replace(/\.md$/, '');
  if (a.startsWith('skills/')) return base(a);
  const parts = a.split('/');
  const inner = a.startsWith('_vault/') ? parts.slice(2) : parts.slice(1);
  if (a.startsWith('_vault/') && parts.length === 2) return base(a).replace(/\.md$/, '');
  return (inner.length ? inner.join(' / ') : base(a)).replace(/\.md$/, '');
}
function artDesc(a) {
  if (a === '_vault/design/baukasten') return 'Neutraler Baukasten für Oberflächen-Entwürfe aus Standard-HTML und CSS-Variablen';
  return DESC[a + '/SKILL.md'] || DESC[a] || '';
}
function model() {
  const groups = {};
  for (const g of GROUPS) groups[g.id] = new Map();
  const q = st.q.trim().toLowerCase();
  st.textHits = new Set();
  for (const p of files.keys()) {
    if (q && !p.toLowerCase().includes(q)) {
      if (q.length < 3 || !isEditable(p) || !contentOf(p).toLowerCase().includes(q)) continue;
      st.textHits.add(p);
    }
    const [g, sub] = placeOf(p);
    if (!groups[g].has(sub)) groups[g].set(sub, new Map());
    const a = artifactOf(p);
    const arts = groups[g].get(sub);

    arts.get(a).push(p);

}
function subsOf(g, map) {
  const def = GROUPS.find((x) => x.id === g).subs;

}
function revealPath(p) {
  const [g, sub] = placeOf(p);
  st.exp.add('g:' + g); st.exp.add(`s:${g}:${sub}`);
  const a = artifactOf(p);

/* ---------- Beispiel-Inhalte ---------- */
function contentOf(p) {

  if (e === 'html' || e === 'htm') return `<!doctype html>\n<html lang="de">\n<head>\n  <meta charset="utf-8">\n  <title>Galerie (Beispiel)</title>\n  <link rel="stylesheet" href="tokens.css">\n  <link rel="stylesheet" href="kit.css">\n  <script src="kit.js" defer><\/script>\n</head>\n<body>\n  <h1>Galerie</h1>\n  <div class="kit-card">\n    <p>Knöpfe</p>\n    <button class="kit-btn">Speichern</button>\n    <button class="kit-btn">Abbrechen</button>\n  </div>\n</body>\n</html>\n`;

/* ---------- Baum ---------- */
function fileRow(p, d) {

}
function artRows(a, list, d) {

  }

}
function renderTree() {

  const m = model();
  let h = '';
  for (const g of GROUPS) {

    if (!subs.length) continue;

function htmlPreview(p) {

  const dir = p.split('/').slice(0, -1).join('/');

function mdToHtml(src) {
  const body = src.replace(/^---[\s\S]*?---\n/, '');

  const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const flushTable = () => { if (!table.length) return; const rows = table.filter((r) => !/^\|[-| ]+\|$/.test(r)); h += '<table>' + rows.map((r, i) => '<tr>' + r.split('|').slice(1, -1).map((c) => `<${i ? 'td' : 'th'}>${inline(c.trim())}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>'; table = []; };
  for (const l of lines) {
    if (l.startsWith('```')) { h += inCode ? '</code></pre>' : '<pre><code>'; inCode = !inCode; continue; }
    if (inCode) { h += esc(l) + '\n'; continue; }
    if (l.startsWith('|')) { table.push(l); continue; } else flushTable();
    if (/^- /.test(l)) { if (!inList) { h += '<ul>'; inList = true; } h += `<li>${inline(l.slice(2))}</li>`; continue; }
    if (inList) { h += '</ul>'; inList = false; }
    const m = l.match(/^(#{1,3}) (.*)/);
    if (m) h += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;
    else if (l.startsWith('> ')) h += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (l.trim()) h += `<p>${inline(l)}</p>`;
  }
  flushTable(); if (inList) h += '</ul>';
  return h;
}

function mountEditor() {

    <h2>Häufigste Aufgabe</h2><ul><li>Skill öffnen → Datei im Baum wählen → ändern → Strg S. Fertig, gespiegelt.</li><li>Ctrl K → Begriff tippen → Treffer im Baum öffnen.</li><li>Seltener: neue Datei in einem Skill- oder Wissensordner anlegen (+ am Ordner).</li></ul>
    <h2>Regeln</h2><ul>
      <li>Einstieg: Knopf „Bibliothek“ der Seitenleiste oder Ctrl K aus jeder Ansicht (Fokus ins Suchfeld). Der bisherige Suchdialog entfällt.</li>
      <li>Suchfeld: Name ab 1 Zeichen, Inhalt ab 3 Zeichen über den Suchindex; Treffer nur im Text tragen „im Text“, Öffnen springt zur Fundstelle.</li>
      <li>Löschen an jeder Datei (Mülleimer in der Zeile, Knopf im Kopf), ohne Rückfrage, mit Rückgängig. Die Datei liegt 30 Tage im Papierkorb des Verwalters; eine gespiegelte Kopie in ~\\.claude geht mit, wenn sie gleich ist.</li>
      <li>Baum wie die Gruppen der Suche: Anweisungen, Skills, Wissen → Untergruppe → Eintrag → Ordner und Dateien.</li>
      <li>Gezeigt wird nur, was die Suche einliest (Erlaubnisliste der Bibliothek).</li>
      <li>Textdateien bis 2 MB bearbeitbar; Bild und PDF nur Ansicht; der Rest „Extern öffnen“.</li>
      <li>Markdown und HTML: Schalter Bearbeiten/Vorschau; HTML-Vorschau lädt CSS, JS und Bilder aus ihrem Ordner.</li>
      <li>Speichern prüft, ob die Datei seit dem Öffnen woanders geändert wurde; Rückmeldung in der Zeile unter dem Kopf („✓ gespeichert“, Spiegeln), kein Toast.</li>
      <li>HTML-Vorschau zeigt den gespeicherten Stand; Markdown-Vorschau den aktuellen Text.</li>
      <li>Zeilenenden (CRLF/LF) und BOM bleiben beim Speichern erhalten.</li>
      <li>Nach dem Speichern: Skills, Befehle, Ausgabestile, CLAUDE.md werden nach ~\\.claude gespiegelt; Suchindex wird nachgezogen.</li>
      <li>Ungespeichertes bleibt beim Wechsel erhalten (Punkt am Knopf „Bibliothek“), auch nach Neustart.</li>
      <li>Umbenennen: im Explorer („Im Ordner zeigen“).</li>
    </ul>
    <h2>Was Beispiel ist</h2><ul><li>Echt: Ordner, Dateinamen, Größen, Änderungszeiten, Skill-Beschreibungen (gekürzt).</li><li>Beispiel: alle Dateiinhalte, Gedächtnis-Namen, Seitenleiste, Uhrzeiten des Abgleichs.</li><li>Editor: echtes CodeMirror 6 aus dem Netz; ohne Netz ein einfaches Textfeld.</li></ul></div>`;
  dlg.showModal();
}

/* ---------- Bedienung ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.close) { t.closest('dialog').close(); document.getElementById('dlg').style.width = ''; return; }
  if (d.info) { info(); return; }
  if (d.e) { st[d.e] = d.v; render(); return; }
  if (d.nav === 'lib') { st.screen = 'lib'; render(); return; }
  if (d.nav === 'search') { st.screen = 'search'; render(); return; }
  if (d.nav === 'none') { toast('Im Entwurf nicht gezeichnet'); return; }
  if (d.tog) { st.exp.has(d.tog) ? st.exp.delete(d.tog) : st.exp.add(d.tog); refreshChrome(); return; }
  if (d.open) { st.justSaved = null; st.discarded = null; st.screen = 'lib'; st.open = d.open; st.pane = 'detail'; st.mode = 'edit'; revealPath(d.open); render(); return; }
  if (d.home) { st.open = null; st.pane = 'detail'; render(); return; }
  if (d.back) { st.pane = 'tree'; render(); return; }
  if (d.mode) { st.mode = d.mode; render(); return; }
  if (d.new) { newFileDialog(d.new); return; }
  if (d.del) { const p = d.del; st.deleted = { path: p, info: files.get(p), text: currentText(p), mirrored: MIRRORED.test(p) }; files.delete(p); st.drafts.delete(p); if (st.open === p) st.open = null; render(); return; }
  if (d.act === 'undo-delete') { const x = st.deleted; files.set(x.path, x.info); st.text.set(x.path, x.text); st.deleted = null; st.open = x.path; st.pane = 'detail'; revealPath(x.path); render(); return; }
  if (d.conf === 'reload') { st.drafts.delete(st.open); document.getElementById('dlg').close(); render(); toast('Neu geladen'); return; }
  if (d.conf === 'overwrite') { document.getElementById('dlg').close(); const z = st.z; st.z = 'normal'; save(); st.z = z; return; }
  if (d.act === 'save') { save(); return; }
  if (d.act === 'discard') { st.discarded = { path: st.open, text: st.drafts.get(st.open) }; st.drafts.delete(st.open); render(); return; }
  if (d.act === 'undo-discard') { st.drafts.set(st.discarded.path, st.discarded.text); st.discarded = null; render(); return; }
  if (d.act === 'reveal') { toast('Explorer zeigt die Datei'); return; }
  if (d.act === 'extern') { toast('Datei öffnet im Standardprogramm'); return; }
  if (d.act === 'reload') { render(); return; }
  if (d.act === 'mirror') { st.savedOnce = null; st.z = 'normal'; render(); toast('Gespiegelt'); return; }
  if (d.act === 'settings') { toast('Springt zu Einstellungen › Bibliothek › Ordner'); return; }
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'q') { st.q = ev.target.value; refreshChrome(); } });
document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); const q = document.getElementById('q'); if (q) { q.focus(); q.select(); } return; }
});
readHash();
render();
cmReady.then(() => { if (document.getElementById('editor')) { const y = 0; render(); } });
</script>
