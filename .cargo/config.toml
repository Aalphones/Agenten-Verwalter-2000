# whisper.cpp (Diktieren) wird per CMake mit dem Visual-Studio-Generator gebaut. Das cmake-Crate setzt dabei
# CMAKE_C(XX)_FLAGS_RELEASE auf Flags ohne Optimierung und ohne NDEBUG, wenn sie nicht von außen kommen: die
# Erkennung lief dadurch rund zehnmal langsamer (small-Modell auf einem Ryzen 5 3600: 41,8 s statt 4,1 s für 5 s Audio).
# /MD muss mit, weil Rust die dynamische C-Laufzeit linkt. Nur für Windows: unter macOS/Linux beide Variablen vorher auf
# "-O3 -DNDEBUG" setzen — ein schon gesetzter Wert hat Vorrang vor [env] (so macht es .github/workflows/release.yml).
[env]
CMAKE_C_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
